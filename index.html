<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六年二班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1000px 700px at 15% 0%,rgba(124,58,237,.28),transparent 60%),radial-gradient(900px 600px at 85% 20%,rgba(217,70,239,.16),transparent 60%),radial-gradient(1000px 800px at 50% 100%,rgba(91,33,182,.32),transparent 65%),linear-gradient(180deg,#14081f,#1e0b30);background-attachment:fixed;color:#f3e8ff;min-height:100vh;overflow-x:hidden}
.nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:8px;padding:0 16px;background:rgba(20,8,31,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(167,139,250,.18);z-index:100;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.brand{font-size:16px;font-weight:800;background:linear-gradient(120deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;margin-right:8px}
.nav-links{display:flex;gap:6px;background:rgba(139,92,246,.1);padding:5px;border-radius:999px;border:1px solid rgba(167,139,250,.18)}
.btn{border:none;background:transparent;color:#c4b5fd;font-size:13.5px;font-weight:700;padding:8px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.25s}
.btn:hover{color:#f3e8ff;background:rgba(139,92,246,.18)}
.btn.active{background:linear-gradient(120deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 6px 18px -6px rgba(139,92,246,.9)}
.view{display:none;padding:80px 16px 40px;max-width:1080px;margin:0 auto;animation:fadeUp .5s cubic-bezier(.22,1,.36,1)}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,5vw,42px);text-align:center;margin:20px 0;background:linear-gradient(120deg,#ddd6fe,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px;outline:none}
h2{font-size:20px;margin:20px 0 14px;color:#c4b5fd;letter-spacing:1px}
.subtabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.subtab{border:1px solid rgba(167,139,250,.28);background:rgba(139,92,246,.12);color:#c4b5fd;font-family:inherit;font-size:14px;font-weight:800;padding:9px 22px;border-radius:999px;cursor:pointer;transition:.22s}
.subtab:hover{background:rgba(139,92,246,.26);color:#fff}
.subtab.active{background:linear-gradient(120deg,#7c3aed,#a855f7);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px rgba(139,92,246,.9)}
.tab{display:none}.tab.active{display:block}
.card{background:linear-gradient(160deg,rgba(45,17,71,.75),rgba(30,11,48,.75));border:1px solid rgba(167,139,250,.18);border-radius:18px;padding:18px;margin-bottom:14px;backdrop-filter:blur(10px);transition:.25s}
.card:hover{border-color:rgba(167,139,250,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.name{font-weight:800;color:#fff;font-size:15px}
.score{font-size:24px;font-weight:900;color:#f0abfc;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{flex:1;min-width:40px;padding:6px 4px;border:1px solid rgba(167,139,250,.3);background:rgba(139,92,246,.15);color:#fff;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:.18s}
.mini:hover{background:rgba(139,92,246,.4)}
.mini.minus{color:#fca5a5}
.rec{display:flex;align-items:center;gap:8px;padding:10px;background:rgba(20,8,31,.5);border-radius:10px;margin-bottom:6px;font-size:13px;flex-wrap:wrap}
.delta{font-weight:900;min-width:40px;text-align:center}
.delta.p{color:#86efac}.delta.m{color:#fca5a5}
.gray{color:#8b7bb8;font-size:12px}
.empty{text-align:center;color:#8b7bb8;padding:30px;font-size:13px}
.tag{display:inline-block;padding:3px 10px;background:rgba(139,92,246,.25);border:1px solid rgba(167,139,250,.3);border-radius:999px;font-size:11px;color:#c4b5fd;margin:2px}
/* 倒计时 */
.cd{text-align:center;padding:34px 16px;background:linear-gradient(160deg,rgba(91,33,182,.4),rgba(45,17,71,.9));border-radius:26px;border:1px solid rgba(240,171,252,.3);box-shadow:0 30px 80px -30px rgba(240,171,252,.5)}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:22px auto}
.cd-box{background:rgba(20,8,31,.7);border:1px solid rgba(167,139,250,.3);border-radius:16px;padding:16px 6px}
.cd-num{font-size:clamp(28px,5vw,44px);font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 20px rgba(240,171,252,.8)}
.cd-label{font-size:10px;color:#8b7bb8;letter-spacing:2px;font-weight:800;margin-top:6px}
/* 关系图 */
#stage{position:relative;width:100%;height:640px;background:radial-gradient(circle at 50% 50%,rgba(91,33,182,.22),transparent 70%);border-radius:22px;border:1px solid rgba(167,139,250,.15);overflow:hidden}
.bub{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 58%),var(--c);box-shadow:0 12px 30px -8px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08),inset 0 -6px 14px rgba(255,255,255,.25);transition:transform .25s,box-shadow .25s;user-select:none;animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.bub:hover{transform:scale(1.09);box-shadow:0 22px 48px -12px rgba(0,0,0,.75),0 0 0 8px rgba(167,139,250,.28);z-index:10}
.bub .e{line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.bub .n{font-weight:800;line-height:1.1;color:#2e1065;text-shadow:0 1px 2px rgba(255,255,255,.5)}
/* 个人主页 */
.ovl{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,8,31,.85);backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:.3s}
.ovl.on{opacity:1;pointer-events:auto}
.pcard{position:relative;width:min(920px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;grid-template-columns:1fr 1.05fr;gap:26px;padding:34px;border-radius:28px;background:linear-gradient(160deg,rgba(45,17,71,.97),rgba(30,11,48,.97));border:1px solid rgba(167,139,250,.4);transform:translateY(20px);transition:.35s cubic-bezier(.34,1.4,.64,1)}
.ovl.on .pcard{transform:none}
@media(max-width:720px){.pcard{grid-template-columns:1fr;gap:18px;padding:24px 20px}}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(139,92,246,.2);color:#c4b5fd;font-size:16px;cursor:pointer;font-family:inherit;transition:.22s;z-index:2}
.close:hover{background:rgba(139,92,246,.42);color:#fff;transform:rotate(90deg)}
.bav{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7),0 0 0 3px rgba(167,139,250,.28),inset 0 -8px 20px rgba(255,255,255,.3)}
.pname{font-size:26px;font-weight:900;color:#fff;margin-bottom:10px}
.pintro{font-size:14.5px;line-height:1.85;color:#c4b5fd;margin:14px 0;white-space:pre-wrap}
.pmeta{font-size:12.5px;color:#8b7bb8;margin:12px 0;letter-spacing:.3px}
.bedit{border:none;cursor:pointer;font-family:inherit;padding:10px 22px;border-radius:999px;font-size:13.5px;font-weight:800;color:#fff;background:linear-gradient(120deg,#7c3aed,#c026d3);box-shadow:0 10px 24px -10px rgba(139,92,246,.95);margin-top:14px;transition:.22s}
.bedit:hover{transform:translateY(-2px)}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:400}
.modal.on{display:flex}
.mbox{background:linear-gradient(160deg,#2d1147,#1e0b30);border:1px solid rgba(167,139,250,.42);border-radius:22px;padding:26px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 40px 100px -25px rgba(0,0,0,.95)}
.mbox h3{margin-bottom:16px;color:#fff;font-size:18px;text-align:center;letter-spacing:1px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:#8b7bb8;font-weight:800;margin-bottom:5px;letter-spacing:.5px}
.fld input,.fld textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(167,139,250,.3);background:rgba(20,8,31,.6);color:#fff;font-family:inherit;font-size:14px;outline:none;transition:.18s}
.fld input:focus,.fld textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.fld textarea{min-height:72px;resize:vertical}
.rule-list{font-size:13.5px;line-height:1.95;color:#c4b5fd;padding-left:20px;margin-bottom:16px}
.rule-list strong{color:#fff}
.relrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.relrow select{flex:0 0 112px;padding:8px;border-radius:8px;border:1px solid rgba(167,139,250,.3);background:rgba(20,8,31,.6);color:#fff;font-family:inherit;font-size:12px}
.relrow input[type=text]{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(167,139,250,.3);background:rgba(20,8,31,.6);color:#fff;font-family:inherit;font-size:12px;min-width:0}
.relrow input[type=range]{flex:0 0 60px;accent-color:#a78bfa}
.relrow button{flex:0 0 28px;height:28px;border-radius:50%;border:none;background:rgba(239,68,68,.18);color:#fca5a5;cursor:pointer;font-size:11px}
.mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(167,139,250,.15)}
.mbtns button{padding:10px 22px;border-radius:10px;border:none;font-weight:800;font-family:inherit;font-size:13.5px;cursor:pointer;transition:.2s}
.bcancel{background:rgba(139,92,246,.15);color:#c4b5fd}
.bcancel:hover{background:rgba(139,92,246,.3);color:#fff}
.bsave{background:linear-gradient(120deg,#7c3aed,#c026d3);color:#fff;box-shadow:0 10px 24px -10px rgba(139,92,246,.95)}
.bsave:hover{transform:translateY(-2px)}
.warn{background:rgba(239,68,68,.15);border:2px solid rgba(239,68,68,.5);border-radius:14px;padding:14px;text-align:center;margin:14px 0;font-size:13px;line-height:1.8;color:#fca5a5;font-weight:700}
/* 老师卡片 */
.tcard{background:linear-gradient(160deg,rgba(45,17,71,.85),rgba(30,11,48,.85));border:1px solid rgba(167,139,250,.18);border-radius:22px;padding:22px 16px;text-align:center;transition:.28s;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);box-shadow:0 0 20px -2px var(--c)}
.tcard:hover{transform:translateY(-4px);border-color:rgba(167,139,250,.45);box-shadow:0 22px 50px -22px rgba(0,0,0,.85)}
.tavatar{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:52px;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 60%),var(--c);box-shadow:0 14px 34px -12px rgba(0,0,0,.7),0 0 0 3px rgba(167,139,250,.2);transition:.3s}
.tcard:hover .tavatar{transform:scale(1.06)}
/* 像素世界 */
.pixel-layout{display:grid;grid-template-columns:1fr 260px;gap:14px}
@media(max-width:780px){.pixel-layout{grid-template-columns:1fr}}
.pixel-canvas-wrap{background:rgba(20,8,31,.8);border:1px solid rgba(167,139,250,.3);border-radius:14px;padding:8px;overflow:auto}
canvas.px{display:block;image-rendering:pixelated;cursor:crosshair;max-width:100%;height:auto;border-radius:8px}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;background:rgba(45,17,71,.5);padding:10px;border-radius:14px;border:1px solid rgba(167,139,250,.15)}
.tool{padding:6px 11px;border:1px solid rgba(167,139,250,.3);background:rgba(139,92,246,.15);color:#fff;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.18s}
.tool:hover{background:rgba(139,92,246,.35)}
.tool.on{background:linear-gradient(120deg,#7c3aed,#a855f7);border-color:transparent}
.tool.primary{background:linear-gradient(120deg,#7c3aed,#c026d3);border-color:transparent}
.tool.danger{background:linear-gradient(120deg,#dc2626,#991b1b);border-color:transparent}
.sidepanel{background:linear-gradient(160deg,rgba(45,17,71,.75),rgba(30,11,48,.75));border:1px solid rgba(167,139,250,.2);border-radius:14px;padding:14px;margin-bottom:10px}
.sidepanel h4{font-size:12px;color:#c4b5fd;letter-spacing:1.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sidepanel h4::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,#a78bfa,#c026d3)}
.info-item{font-size:12px;color:#c4b5fd;padding:6px 0;display:flex;justify-content:space-between;border-bottom:1px dashed rgba(167,139,250,.1)}
.info-item:last-child{border-bottom:none}
.info-item strong{color:#fff}
.events{max-height:340px;overflow-y:auto}
.events::-webkit-scrollbar{width:4px}
.events::-webkit-scrollbar-thumb{background:rgba(139,92,246,.3);border-radius:2px}
.ev{font-size:11.5px;color:#c4b5fd;padding:6px 9px;background:rgba(20,8,31,.5);border-radius:8px;border-left:3px solid var(--ec,#a78bfa);margin-bottom:5px;line-height:1.5}
.ev .time{font-size:10px;color:#8b7bb8;display:block;margin-top:2px}
/* 贪吃蛇 */
canvas.snake{display:block;margin:0 auto;background:rgba(10,4,18,.9);border-radius:14px;border:2px solid rgba(167,139,250,.4);max-width:100%;height:auto;box-shadow:0 20px 60px -20px rgba(139,92,246,.6)}
.snake-hud{display:flex;justify-content:center;gap:20px;margin:16px 0;font-size:14px;color:#c4b5fd;font-weight:700;flex-wrap:wrap}
.snake-hud span{background:rgba(45,17,71,.7);padding:8px 18px;border-radius:12px;border:1px solid rgba(167,139,250,.2)}
.snake-hud strong{color:#fff;font-size:18px;margin-left:6px}
.snake-ctrl{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:8px;justify-content:center;margin-top:16px}
.dir-btn{background:rgba(139,92,246,.2);border:1px solid rgba(167,139,250,.35);border-radius:12px;color:#fff;font-size:22px;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s}
.dir-btn:active{background:rgba(139,92,246,.55)}
.dir-btn.up{grid-column:2;grid-row:1}
.dir-btn.left{grid-column:1;grid-row:2}
.dir-btn.down{grid-column:2;grid-row:2}
.dir-btn.right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<nav class="nav">
<span class="brand">六年二班</span>
<div class="nav-links">
<button class="btn active" data-v="home">首页</button>
<button class="btn" data-v="members">成员</button>
<button class="btn" data-v="score">加分</button>
<button class="btn" data-v="medal">勋章</button>
<button class="btn" data-v="cd">倒计时</button>
<button class="btn" data-v="games">游戏</button>
</div>
</nav>

<!-- 首页 -->
<div id="v-home" class="view active">
<h1 contenteditable="true" id="className">六年二班</h1>
<p class="gray" style="text-align:center;letter-spacing:4px;font-size:14px;color:#c4b5fd" contenteditable="true" id="schoolName">北京邮电大学附属小学</p>
<div class="card" style="margin-top:32px"><p contenteditable="true" id="introText" style="line-height:2;color:#c4b5fd;font-size:15px"></p></div>
<p class="gray" style="text-align:center;margin-top:14px">点击文字即可编辑，内容自动保存</p>
</div>

<!-- 成员 -->
<div id="v-members" class="view">
<div class="subtabs">
<button class="subtab active" data-tab="students">👥 同学</button>
<button class="subtab" data-tab="teachers">🎓 老师</button>
</div>
<div id="tab-students" class="tab active">
<p class="gray" style="text-align:center;margin-bottom:14px">点击气泡，查看同学主页</p>
<div id="stage"></div>
</div>
<div id="tab-teachers" class="tab">
<div class="grid" id="teacherGrid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))"></div>
</div>
</div>

<!-- 加分 -->
<div id="v-score" class="view">
<h2>🏆 个人加分</h2>
<div class="grid" id="scoreGrid"></div>
<h2 style="margin-top:30px">📋 加分记录</h2>
<div id="recordList"></div>
<h2 style="margin-top:30px">🥇 表扬前五</h2>
<div id="rankList"></div>
</div>

<!-- 勋章 -->
<div id="v-medal" class="view">
<h2>🏅 荣誉勋章</h2>
<p class="gray" style="margin-bottom:14px">铜牌5分 / 银牌15分 / 金牌30分 / 钻石50分 / 传说100分</p>
<div id="medalList"></div>
</div>

<!-- 倒计时 -->
<div id="v-cd" class="view">
<h2 style="text-align:center">⏳ 节日倒计时</h2>
<div class="cd">
<div style="font-size:64px" id="cdIcon">🎉</div>
<div style="font-size:26px;font-weight:900;color:#fff;margin:10px 0" id="cdName">元旦</div>
<div class="gray" id="cdDate">2027-01-01</div>
<div class="cd-grid">
<div class="cd-box"><div class="cd-num" id="cdD">0</div><div class="cd-label">天</div></div>
<div class="cd-box"><div class="cd-num" id="cdH">0</div><div class="cd-label">时</div></div>
<div class="cd-box"><div class="cd-num" id="cdM">0</div><div class="cd-label">分</div></div>
<div class="cd-box"><div class="cd-num" id="cdS">0</div><div class="cd-label">秒</div></div>
</div>
<div class="gray" style="margin-top:16px" id="cdTotal"></div>
</div>
<div id="festivalList" class="grid" style="margin-top:20px"></div>
</div>

<!-- 游戏 -->
<div id="v-games" class="view">
<div class="subtabs">
<button class="subtab active" data-tab="pixel">🌍 像素世界</button>
<button class="subtab" data-tab="snake">🐍 贪吃蛇</button>
</div>
<div id="tab-pixel" class="tab active">
<div class="warn">⚠️ 重要提醒：在校期间请勿游玩！仅供放学后、周末和假期在家使用。</div>
<div class="tools">
<button class="tool" data-g="male">👦 男生</button>
<button class="tool" data-g="female">👧 女生</button>
<span style="color:#8b7bb8;padding:6px 4px">|</span>
<button class="tool on" data-m="move">🚶 移动</button>
<button class="tool" data-b="house">🏠 小屋</button>
<button class="tool" data-b="castle">🏰 城堡</button>
<button class="tool" data-b="tree">🌳 树</button>
<button class="tool" data-b="flag">🚩 旗帜</button>
<button class="tool" data-b="erase">🗑️ 清除</button>
<button class="tool primary" id="makeNation">🏛️ 创建国家</button>
<button class="tool" id="pixelRules">📜 规则</button>
<button class="tool danger" id="pixelReset">🔄 重置</button>
</div>
<div class="pixel-layout">
<div class="pixel-canvas-wrap"><canvas class="px" id="pxCanvas"></canvas></div>
<div>
<div class="sidepanel"><h4>👤 我的信息</h4><div id="myInfo"></div></div>
<div class="sidepanel"><h4>🌐 世界事件</h4><div class="events" id="pxEvents"></div></div>
</div>
</div>
</div>
<div id="tab-snake" class="tab">
<div class="warn">⚠️ 在校期间请勿游玩！仅供放学后、周末和假期在家使用。</div>
<div class="snake-hud">
<span>得分 <strong id="snakeScore">0</strong></span>
<span>最高 <strong id="snakeBest">0</strong></span>
</div>
<canvas class="snake" id="snakeCanvas" width="480" height="480"></canvas>
<div class="snake-ctrl">
<button class="dir-btn up" data-d="up">▲</button>
<button class="dir-btn left" data-d="left">◀</button>
<button class="dir-btn down" data-d="down">▼</button>
<button class="dir-btn right" data-d="right">▶</button>
</div>

function buildPeople(){
  return P.map(([n,e,i,t],idx)=>({id:'p'+(idx+1),name:n,emoji:e,intro:i,tags:t.split(','),color:COLORS[idx%COLORS.length],score:0,relations:{}}));
}
function attachRels(people){
  const map=Object.fromEntries(people.map(p=>[p.id,p]));
  RELS.forEach(([a,b,l,s])=>{
    if(map[a]&&map[b]){
      map[a].relations[b]={label:l,strength:s};
      map[b].relations[a]={label:l,strength:s};
    }
  });
}
function tryParse(s){try{return JSON.parse(s)}catch(e){return null}}
/* 从多个 key 里迁移数据 */
function loadAllData(){
  // 1. 优先读 class62
  let d=tryParse(localStorage.getItem(KEY));
  if(d&&Array.isArray(d.people)&&d.people.length>=40&&d.people[0].relations&&Object.keys(d.people[0].relations).length>0){
    return d;
  }
  // 2. 尝试从旧 key 迁移
  const oldPeople=tryParse(localStorage.getItem('class-bubbles-v3'));
  const oldHome=tryParse(localStorage.getItem('class-home-v1'));
  const oldScore=tryParse(localStorage.getItem('class-score-v3'));
  const oldTeachers=tryParse(localStorage.getItem('class-teachers-v1'));
  if(oldPeople&&Array.isArray(oldPeople)&&oldPeople.length>=40){
    const merged={
      className: (oldHome&&oldHome.className)||DEF.className,
      schoolName: (oldHome&&oldHome.schoolName)||DEF.schoolName,
      intro: (oldHome&&oldHome.intro&&oldHome.intro!=='undefined')?oldHome.intro:DEF.intro,
      people: oldPeople.map((p,i)=>({
        id:p.id||('p'+(i+1)),
        name:p.name||'同学',
        emoji:p.emoji||'🙂',
        intro:p.intro||'',
        tags:Array.isArray(p.tags)?p.tags:[],
        color:p.color||COLORS[i%COLORS.length],
        score:0,
        relations:p.relations||{}
      })),
      records: (oldScore&&Array.isArray(oldScore.records))?oldScore.records:[],
      teachers: (oldTeachers&&Array.isArray(oldTeachers)&&oldTeachers.length)?oldTeachers:DEF.teachers
    };
    // 合并分数
    if(oldScore&&oldScore.scores){
      merged.people.forEach(p=>{
        if(oldScore.scores[p.id]!==undefined) p.score=oldScore.scores[p.id];
      });
    }
    // 保存到新 key
    localStorage.setItem(KEY,JSON.stringify(merged));
    return merged;
  }
  // 3. 全新初始化
  const fresh={
    className:DEF.className,schoolName:DEF.schoolName,intro:DEF.intro,
    people:buildPeople(),records:[],teachers:DEF.teachers.map(t=>({...t})),
    pixel:JSON.parse(JSON.stringify(DEF.pixel)),snakeBest:0,
    pixelRulesSeen:false,snakeRulesSeen:false
  };
  attachRels(fresh.people);
  return fresh;
}

/* ================= 加分 ================= */
function renderScore(){
  document.getElementById('scoreGrid').innerHTML=D.people.map(p=>`
    <div class="card">
      <div class="name">${p.emoji} ${p.name}</div>
      <div class="score">${p.score}</div>
      <div class="row">
        <button class="mini" onclick="addScore('${p.id}',1)">+1</button>
        <button class="mini" onclick="addScore('${p.id}',2)">+2</button>
        <button class="mini" onclick="addScore('${p.id}',5)">+5</button>
        <button class="mini minus" onclick="addScore('${p.id}',-1)">−1</button>
        <button class="mini" onclick="addScore('${p.id}','c')">＋?</button>
      </div>
    </div>`).join('');
  document.getElementById('recordList').innerHTML=D.records.length?D.records.slice(0,20).map(r=>`
    <div class="rec">
      <span class="delta ${r.d>0?'p':'m'}">${r.d>0?'+':''}${r.d}</span>
      <span class="name" style="min-width:60px">${r.name}</span>
      <span class="gray" style="flex:1">${r.reason||''}</span>
      <span class="gray">${new Date(r.t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
      <button class="mini" style="flex:0;min-width:auto" onclick="undoRec(${r.t})">撤销</button>
    </div>`).join(''):'<div class="empty">还没有记录</div>';
  const ranked=[...D.people].filter(p=>p.score>0).sort((a,b)=>b.score-a.score).slice(0,5);
  document.getElementById('rankList').innerHTML=ranked.length?ranked.map((p,i)=>`
    <div class="rec">
      <span style="font-size:20px">${['🥇','🥈','🥉','',''][i]||''}</span>
      <span class="name" style="flex:1">${p.emoji} ${p.name}</span>
      <span class="delta p">+${p.score}</span>
    </div>`).join(''):'<div class="empty">还没有人加分</div>';
}
window.addScore=function(id,d){
  const p=D.people.find(x=>x.id===id);if(!p)return;
  if(d==='c'){const n=Number(prompt('加减分：','3'));if(!n)return;d=n}
  d=Number(d);if(!d)return;
  p.score+=d;
  const reason=prompt('原因（可选）：','')||(d>0?'表现优秀':'违反纪律');
  D.records.unshift({name:p.name,d,reason,t:Date.now()});
  if(D.records.length>200)D.records=D.records.slice(0,200);
  save();renderScore();renderMedal();
};
window.undoRec=function(t){
  const i=D.records.findIndex(r=>r.t===t);if(i<0)return;
  const r=D.records[i];const p=D.people.find(x=>x.name===r.name);
  if(p)p.score-=r.d;D.records.splice(i,1);save();renderScore();renderMedal();
};

const MEDALS=[{i:'🥉',n:'铜牌',s:5,c:'#d97706'},{i:'🥈',n:'银牌',s:15,c:'#cbd5e1'},{i:'🥇',n:'金牌',s:30,c:'#fbbf24'},{i:'💎',n:'钻石',s:50,c:'#67e8f9'},{i:'👑',n:'传说',s:100,c:'#f0abfc'}];

    return `<div class="card"><div class="name">${p.emoji} ${p.name} <span class="gray">${p.score}分</span></div><div style="margin-top:12px">${ms}</div></div>`;

/* ================= 关系图 ================= */
function renderBubbles(){
  const stage=document.getElementById('stage');
  if(!stage)return;
  stage.innerHTML='';
  const W=stage.clientWidth,H=stage.clientHeight;
  if(W<10||H<10)return;
  const cx=W/2,cy=H/2,n=D.people.length;
  const baseR=Math.max(20,Math.min(42,Math.sqrt(W*H/(n*Math.PI*3.8))));
  const nodes=D.people.map((p,i)=>{
    const rc=Object.keys(p.relations||{}).length;
    const r=baseR+Math.min(rc,8)*1.4;
    const ang=i*(Math.PI*2/n);
    const rad=Math.min(W,H)*0.36*Math.sqrt((i+0.5)/n);
    return {p,r,x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad};
  });
  for(let it=0;it<200;it++){
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const a=nodes[i],b=nodes[j];
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01;
        const md=a.r+b.r+6;
        if(d<md){
          const push=(md-d)/2,ux=dx/d,uy=dy/d;
          a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;
        }
      }
    }
    nodes.forEach(nd=>{nd.x+=(cx-nd.x)*0.01;nd.y+=(cy-nd.y)*0.01});
  }
  nodes.forEach((nd,i)=>{
    nd.x=Math.max(nd.r+4,Math.min(W-nd.r-4,nd.x));
    nd.y=Math.max(nd.r+4,Math.min(H-nd.r-4,nd.y));
    const el=document.createElement('div');
    el.className='bub';
    el.style.width=el.style.height=(nd.r*2)+'px';
    el.style.left=(nd.x-nd.r)+'px';
    el.style.top=(nd.y-nd.r)+'px';
    el.style.setProperty('--c',nd.p.color);

function renderRelGraph(p){
  const svg=document.getElementById('relGraph');
  const W=500,H=480,cx=W/2,cy=240;
  const entries=Object.entries(p.relations||{}).map(([id,r])=>{
    const per=D.people.find(x=>x.id===id);
    return per?{id,label:r.label,strength:r.strength,per}:null;
  }).filter(Boolean).slice(0,8);
  if(!entries.length){
    svg.innerHTML=`<circle cx="${cx}" cy="${cy}" r="48" fill="${p.color}"/><text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="30">${p.emoji}</text><text x="${cx}" y="${cy+28}" text-anchor="middle" font-size="14" font-weight="800" fill="#2e1065">${p.name}</text><text x="${cx}" y="${cy+110}" text-anchor="middle" font-size="13" fill="#8b7bb8">还没有添加关系~</text>`;
    return;
  }
  const R=150,n=entries.length;
  entries.forEach((e,i)=>{
    const ang=-Math.PI/2+(i*2*Math.PI/n);
    e._x=cx+Math.cos(ang)*R;
    e._y=cy+Math.sin(ang)*R;
  });
  let edges='';
  entries.forEach(e=>{
    const w=1+e.strength*1.6,op=0.25+e.strength*0.13;
    edges+=`<line x1="${cx}" y1="${cy}" x2="${e._x}" y2="${e._y}" stroke="${p.color}" stroke-width="${w}" opacity="${op}"/>`;
  });
  let html=`<g><circle cx="${cx}" cy="${cy}" r="50" fill="${p.color}"/><circle cx="${cx}" cy="${cy}" r="50" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/><text x="${cx}" y="${cy-6}" text-anchor="middle" dominant-baseline="middle" font-size="30">${p.emoji}</text><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="14" font-weight="800" fill="#2e1065">${p.name}</text></g>`;
  entries.forEach(e=>{
    html+=`<g><circle cx="${e._x}" cy="${e._y}" r="30" fill="${e.per.color}"/><text x="${e._x}" y="${e._y-3}" text-anchor="middle" dominant-baseline="middle" font-size="20">${e.per.emoji}</text><text x="${e._x}" y="${e._y+44}" text-anchor="middle" font-size="12" font-weight="800" fill="#e9d5ff">${e.per.name}</text><text x="${e._x}" y="${e._y+58}" text-anchor="middle" font-size="10" fill="#8b7bb8">${e.label}</text></g>`;
  });
  svg.innerHTML=edges+html;
}

  const n=list[0],diff=Math.max(0,n.date-now);

/* ================= 像素世界 ================= */
const PW=50,PH=30,PS=16;
const canvas=document.getElementById('pxCanvas');
const ctx=canvas.getContext('2d');
canvas.width=PW*PS;canvas.height=PH*PS;
const BUILD_NAMES={house:'小屋',castle:'城堡',tree:'树',flag:'旗帜'};
const NC=['#f87171','#fb923c','#fbbf24','#a3e635','#34d399','#22d3ee','#60a5fa','#a78bfa','#e879f9','#f472b6'];
function addEvent(t,color){
  D.pixel.events.unshift({t,color:color||'#a78bfa',time:Date.now()});
  if(D.pixel.events.length>50)D.pixel.events=D.pixel.events.slice(0,50);
}
function K(x,y){return x+','+y}
function findMyPerson(){
  for(const k in D.pixel.buildings){
    const b=D.pixel.buildings[k];
    if(b.type==='person'&&b.pid===D.pixel.pid)return k;
  }
  return null;
}
function renderPixel(){
  if(!ctx)return;
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'#166534');g.addColorStop(1,'#14532d');
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let x=0;x<=PW;x++){ctx.beginPath();ctx.moveTo(x*PS,0);ctx.lineTo(x*PS,canvas.height);ctx.stroke()}
  for(let y=0;y<=PH;y++){ctx.beginPath();ctx.moveTo(0,y*PS);ctx.lineTo(canvas.width,y*PS);ctx.stroke()}
  for(const k in D.pixel.buildings){
    const b=D.pixel.buildings[k];
    if(b.type==='person'&&b.nation&&D.pixel.nations[b.nation]){
      const[x,y]=k.split(',').map(Number);
      ctx.fillStyle=D.pixel.nations[b.nation].color+'22';
      ctx.fillRect((x-3)*PS,(y-3)*PS,7*PS,7*PS);
      ctx.strokeStyle=D.pixel.nations[b.nation].color+'66';ctx.lineWidth=2;
      ctx.strokeRect((x-3)*PS+1,(y-3)*PS+1,7*PS-2,7*PS-2);
    }
  }
  for(const k in D.pixel.buildings){
    const[x,y]=k.split(',').map(Number);
    const b=D.pixel.buildings[k];
    const px=x*PS,py=y*PS;
    if(b.type==='person'){
      ctx.fillStyle=b.gender==='female'?'#f472b6':'#60a5fa';
      ctx.fillRect(px+2,py+2,PS-4,PS-4);
      ctx.fillStyle='#fff';ctx.fillRect(px+4,py+5,2,2);ctx.fillRect(px+PS-6,py+5,2,2);
      if(b.nation&&D.pixel.nations[b.nation]){
        ctx.fillStyle=D.pixel.nations[b.nation].color;
        ctx.fillRect(px+PS/2-1,py-3,2,4);
      }
      if(b.pid===D.pixel.pid){
        ctx.strokeStyle='#fef08a';ctx.lineWidth=2;
        ctx.strokeRect(px+1,py+1,PS-2,PS-2);
      }
    }else if(b.type==='house'){
      ctx.fillStyle='#d97706';ctx.fillRect(px+3,py+8,PS-6,PS-9);
      ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(px+1,py+8);ctx.lineTo(px+PS/2,py+2);ctx.lineTo(px+PS-1,py+8);ctx.fill();
      ctx.fillStyle='#fde68a';ctx.fillRect(px+6,py+11,3,3);
    }else if(b.type==='castle'){
      ctx.fillStyle='#a78bfa';ctx.fillRect(px+1,py+5,PS-2,PS-7);
      ctx.fillStyle='#c4b5fd';
      ctx.fillRect(px+2,py+3,3,3);ctx.fillRect(px+PS/2-1.5,py+3,3,3);ctx.fillRect(px+PS-5,py+3,3,3);
      ctx.fillStyle='#fef3c7';ctx.fillRect(px+4,py+9,3,3);ctx.fillRect(px+PS-7,py+9,3,3);
    }else if(b.type==='tree'){
      ctx.fillStyle='#78350f';ctx.fillRect(px+PS/2-2,py+9,4,PS-10);
      ctx.fillStyle='#16a34a';ctx.beginPath();ctx.arc(px+PS/2,py+7,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(px+PS/2-2,py+5,3,0,Math.PI*2);ctx.fill();
    }else if(b.type==='flag'){
      ctx.fillStyle='#78350f';ctx.fillRect(px+PS/2-1,py+3,2,PS-5);
      ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(px+PS/2+1,py+4);ctx.lineTo(px+PS-2,py+7);ctx.lineTo(px+PS/2+1,py+10);ctx.fill();
    }
  }
  const myKey=findMyPerson();
  const myBuild=Object.values(D.pixel.buildings).filter(b=>b.type!=='person'&&b.pid===D.pixel.pid).length;
  const myNation=Object.values(D.pixel.nations).find(n=>n.king===D.pixel.pid);
  let info='';
  if(D.pixel.gender){
    info+=`<div class="info-item"><span>性别</span><strong>${D.pixel.gender==='female'?'👧 女生':'👦 男生'}</strong></div>`;
    info+=`<div class="info-item"><span>坐标</span><strong>${myKey?'('+myKey+')':'未出现'}</strong></div>`;
    info+=`<div class="info-item"><span>建筑</span><strong>${myBuild} / 20</strong></div>`;
    info+=`<div class="info-item"><span>国家</span><strong>${myNation?myNation.name:'无'}</strong></div>`;
  }else{info='<div class="gray">还没有选性别，先点上方 👦/👧</div>'}
  document.getElementById('myInfo').innerHTML=info;
  document.getElementById('pxEvents').innerHTML=D.pixel.events.length?
    D.pixel.events.slice(0,20).map(e=>`<div class="ev" style="--ec:${e.color}">${e.t}<span class="time">${new Date(e.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')
    :'<div class="gray">还没有事件</div>';
}
function ensureMyPerson(){
  if(!D.pixel.pid)D.pixel.pid='px'+Date.now()+Math.random().toString(36).slice(2,6);
  if(findMyPerson())return;
  for(let tries=0;tries<1000;tries++){
    const x=Math.floor(Math.random()*PW),y=Math.floor(Math.random()*PH);
    if(!D.pixel.buildings[K(x,y)]){
      D.pixel.buildings[K(x,y)]={type:'person',pid:D.pixel.pid,gender:D.pixel.gender||'male'};
      D.pixel.x=x;D.pixel.y=y;
      addEvent('👤 '+D.pixel.name+' 来到了像素世界','#86efac');
      return;
    }
  }
}
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*PW);
  const y=Math.floor((e.clientY-r.top)/r.height*PH);
  if(x<0||x>=PW||y<0||y>=PH)return;
  const k=K(x,y);
  const b=D.pixel.buildings[k];
  if(b&&b.type==='person'&&b.pid!==D.pixel.pid){openInteraction(b,k);return}
  if(b&&b.type==='person'&&b.pid===D.pixel.pid)return;
  if(!D.pixel.gender){alert('请先选择 👦 男生 或 👧 女生');return}
  if(D.pixel.mode==='move'){
    if(b){alert('这里已经有东西了~');return}
    const old=findMyPerson();
    const oldN=old?D.pixel.buildings[old].nation:null;
    if(old)delete D.pixel.buildings[old];
    D.pixel.buildings[k]={type:'person',pid:D.pixel.pid,gender:D.pixel.gender,nation:oldN};
    D.pixel.x=x;D.pixel.y=y;
    addEvent('🚶 移动到 ('+x+','+y+')','#60a5fa');
    save();renderPixel();return;
  }
  if(D.pixel.mode==='erase'){
    if(!b)return;
    if(b.type==='person'){alert('不能清除小人~');return}
    delete D.pixel.buildings[k];
    addEvent('🗑️ 清除了一处建筑','#fca5a5');
    save();renderPixel();return;
  }
  if(D.pixel.sel){
    if(b){alert('这里已经有东西了~');return}
    const myBuild=Object.values(D.pixel.buildings).filter(x=>x.type!=='person'&&x.pid===D.pixel.pid).length;
    if(myBuild>=20){alert('每人最多建造 20 个建筑~');return}
    D.pixel.buildings[k]={type:D.pixel.sel,pid:D.pixel.pid};
    addEvent('🏗️ 建造了'+BUILD_NAMES[D.pixel.sel]);
    save();renderPixel();return;
  }
});

  const m=makeModal(`<div class="mbox">

document.getElementById('makeNation').addEventListener('click',()=>{
  if(!D.pixel.gender){alert('请先选性别~');return}
  if(Object.values(D.pixel.nations).some(n=>n.king===D.pixel.pid)){alert('你已经有一个国家啦~');return}
  const name=prompt('国家名称：','我的王国');if(!name)return;
  const nid='n'+Date.now();
  const color=NC[Object.keys(D.pixel.nations).length%NC.length];
  D.pixel.nations[nid]={id:nid,name,color,king:D.pixel.pid,ts:Date.now()};
  const myKey=findMyPerson();
  if(myKey)D.pixel.buildings[myKey].nation=nid;
  addEvent('🏛️ 建立了「'+name+'」！','#fbbf24');
  save();renderPixel();
});

/* ================= 贪吃蛇 ================= */
const SW=480,SH=480,GRID=24,CELL=SW/GRID;
const sCanvas=document.getElementById('snakeCanvas');
const sCtx=sCanvas.getContext('2d');
let snake=[],food={x:0,y:0},dir={x:1,y:0},nextDir={x:1,y:0},snakeScore=0,snakeRunning=false,snakePaused=false,snakeTimer=null,snakeOver=false;
function initSnake(){
  document.getElementById('snakeBest').textContent=D.snakeBest||0;
  resetSnake();drawSnake();
}
function resetSnake(){
  snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  snakeScore=0;snakeOver=false;snakeRunning=false;snakePaused=false;
  document.getElementById('snakeScore').textContent=0;
  document.getElementById('snakeBest').textContent=D.snakeBest||0;
  placeFood();
  if(snakeTimer){clearInterval(snakeTimer);snakeTimer=null}
  drawSnake();
}
function placeFood(){
  let t=0;
  while(t++<500){
    const f={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};
    if(!snake.some(s=>s.x===f.x&&s.y===f.y)){food=f;return}
  }
}
function drawSnake(){
  sCtx.fillStyle='#0a0412';sCtx.fillRect(0,0,SW,SH);
  sCtx.strokeStyle='rgba(167,139,250,.06)';
  for(let x=0;x<=GRID;x++){sCtx.beginPath();sCtx.moveTo(x*CELL,0);sCtx.lineTo(x*CELL,SH);sCtx.stroke()}
  for(let y=0;y<=GRID;y++){sCtx.beginPath();sCtx.moveTo(0,y*CELL);sCtx.lineTo(SW,y*CELL);sCtx.stroke()}
  sCtx.fillStyle='#f472b6';
  sCtx.beginPath();sCtx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);sCtx.fill();
  sCtx.fillStyle='#fbcfe8';
  sCtx.beginPath();sCtx.arc(food.x*CELL+CELL/2-2,food.y*CELL+CELL/2-2,2,0,Math.PI*2);sCtx.fill();
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    sCtx.fillStyle=i===0?'#fbbf24':`rgba(167,139,250,${1-t*0.5})`;
    sCtx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    if(i===0){
      sCtx.fillStyle='#1a0a2a';
      sCtx.fillRect(s.x*CELL+5,s.y*CELL+6,3,3);
      sCtx.fillRect(s.x*CELL+CELL-8,s.y*CELL+6,3,3);
    }
  });
  if(snakeOver){
    sCtx.fillStyle='rgba(10,4,18,.85)';sCtx.fillRect(0,0,SW,SH);
    sCtx.fillStyle='#fca5a5';sCtx.font='bold 32px "PingFang SC"';sCtx.textAlign='center';
    sCtx.fillText('游戏结束',SW/2,SH/2-20);
    sCtx.font='bold 20px "PingFang SC"';sCtx.fillStyle='#c4b5fd';
    sCtx.fillText('得分 '+snakeScore,SW/2,SH/2+20);
    sCtx.fillText('点「重开」再来一局',SW/2,SH/2+55);
  }
  if(snakePaused&&!snakeOver){
    sCtx.fillStyle='rgba(10,4,18,.7)';sCtx.fillRect(0,0,SW,SH);
    sCtx.fillStyle='#f0abfc';sCtx.font='bold 28px "PingFang SC"';sCtx.textAlign='center';
    sCtx.fillText('已暂停',SW/2,SH/2);
  }
}
function stepSnake(){
  if(!snakeRunning||snakePaused||snakeOver)return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){
    snakeOver=true;snakeRunning=false;
    if(snakeTimer){clearInterval(snakeTimer);snakeTimer=null}
    if(snakeScore>(D.snakeBest||0)){D.snakeBest=snakeScore;save()}
    document.getElementById('snakeBest').textContent=D.snakeBest||0;
    drawSnake();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    snakeScore++;document.getElementById('snakeScore').textContent=snakeScore;placeFood();
  }else{snake.pop()}
  drawSnake();
}
document.getElementById('snakeStart').addEventListener('click',()=>{
  if(snakeOver)resetSnake();
  if(snakeRunning&&snakePaused){snakePaused=false;drawSnake();return}
  snakeRunning=true;snakePaused=false;
  if(snakeTimer)clearInterval(snakeTimer);
  snakeTimer=setInterval(stepSnake,140);
  drawSnake();
});
document.getElementById('snakePause').addEventListener('click',()=>{
  if(!snakeRunning||snakeOver)return;
  snakePaused=!snakePaused;drawSnake();
});
document.getElementById('snakeRestart').addEventListener('click',resetSnake);
document.querySelectorAll('.dir-btn').forEach(b=>b.addEventListener('click',()=>{
  const d=b.dataset.d;
  if(d==='up'&&dir.y!==1)nextDir={x:0,y:-1};
  if(d==='down'&&dir.y!==-1)nextDir={x:0,y:1};
  if(d==='left'&&dir.x!==1)nextDir={x:-1,y:0};
  if(d==='right'&&dir.x!==-1)nextDir={x:1,y:0};
}));
document.addEventListener('keydown',e=>{
  if(!document.getElementById('v-games').classList.contains('active'))return;
  if(!document.getElementById('tab-snake').classList.contains('active'))return;
  if(e.key==='ArrowUp'&&dir.y!==1){e.preventDefault();nextDir={x:0,y:-1}}
  if(e.key==='ArrowDown'&&dir.y!==-1){e.preventDefault();nextDir={x:0,y:1}}
  if(e.key==='ArrowLeft'&&dir.x!==1){e.preventDefault();nextDir={x:-1,y:0}}
  if(e.key==='ArrowRight'&&dir.x!==-1){e.preventDefault();nextDir={x:1,y:0}}
});
let tsX=0,tsY=0;
sCanvas.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY},{passive:true});
sCanvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0&&dir.x!==-1)nextDir={x:1,y:0};
    else if(dx<0&&dir.x!==1)nextDir={x:-1,y:0};
  }else{
    if(dy>0&&dir.y!==-1)nextDir={x:0,y:1};
    else if(dy<0&&dir.y!==1)nextDir={x:0,y:-1};
  }
},{passive:true});

  const m=makeModal(`<div class="mbox">
    <h3>🐍 贪吃蛇 · 玩法说明</h3>
    <div class="warn">⚠️ 在校期间请勿游玩！<br>仅供放学后、周末和假期在家使用。</div>
    <ul class="rule-list">
      <li><strong>操作</strong>：键盘方向键 / 屏幕按钮 / 滑动屏幕</li>

    <p class="gray" style="text-align:center">适度游戏益脑，沉迷伤身～</p>
    <div class="mbtns"><button class="bsave" id="snakeAgree" style="width:100%">我已阅读，开始游戏</button></div>

}
