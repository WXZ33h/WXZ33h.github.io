<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六年二班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#14081f,#1e0b30);color:#f3e8ff;min-height:100vh}
.nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(20,8,31,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(167,139,250,.2);z-index:100;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.brand{font-size:15px;font-weight:800;background:linear-gradient(120deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;margin-right:6px}
.btn{border:none;background:transparent;color:#c4b5fd;font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn.active{background:linear-gradient(120deg,#7c3aed,#a855f7);color:#fff}
.view{display:none;padding:80px 16px 40px;max-width:1000px;margin:0 auto}
.view.active{display:block}
h1{font-size:32px;text-align:center;margin:20px 0;background:linear-gradient(120deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:20px;margin:20px 0 12px;color:#c4b5fd}
.card{background:rgba(45,17,71,.7);border:1px solid rgba(167,139,250,.2);border-radius:18px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.name{font-weight:800;color:#fff;font-size:15px}
.score{font-size:24px;font-weight:900;color:#f0abfc;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{flex:1;min-width:40px;padding:6px 4px;border:1px solid rgba(167,139,250,.3);background:rgba(139,92,246,.15);color:#fff;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.mini.minus{color:#fca5a5}
.rec{display:flex;align-items:center;gap:8px;padding:10px;background:rgba(20,8,31,.5);border-radius:10px;margin-bottom:6px;font-size:13px;flex-wrap:wrap}
.delta{font-weight:900;min-width:40px;text-align:center}
.delta.p{color:#86efac}.delta.m{color:#fca5a5}
.gray{color:#8b7bb8;font-size:12px}
.empty{text-align:center;color:#8b7bb8;padding:30px;font-size:13px}
.cd{text-align:center;padding:30px 16px;background:linear-gradient(160deg,rgba(91,33,182,.4),rgba(45,17,71,.9));border-radius:24px;border:1px solid rgba(240,171,252,.3)}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:500px;margin:20px auto}
.cd-box{background:rgba(20,8,31,.7);border:1px solid rgba(167,139,250,.3);border-radius:14px;padding:14px 6px}
.cd-num{font-size:44px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.cd-label{font-size:10px;color:#8b7bb8;letter-spacing:2px;font-weight:800;margin-top:4px}
.medal{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(167,139,250,.2);background:rgba(139,92,246,.1);opacity:.4;margin-right:6px}
.medal.on{opacity:1;border-color:currentColor;box-shadow:0 0 12px currentColor}
.tcard{background:linear-gradient(160deg,rgba(45,17,71,.85),rgba(30,11,48,.85));border:1px solid rgba(167,139,250,.2);border-radius:20px;padding:20px;text-align:center}
.tavatar{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 0 30px -8px currentColor}
.warn{background:rgba(239,68,68,.15);border:2px solid rgba(239,68,68,.5);border-radius:14px;padding:14px;text-align:center;margin:14px 0;font-size:13px;line-height:1.8;color:#fca5a5;font-weight:700}
.pixel-layout{display:grid;grid-template-columns:1fr 260px;gap:14px}
@media(max-width:780px){.pixel-layout{grid-template-columns:1fr}}
.pixel-canvas-wrap{background:rgba(20,8,31,.8);border:1px solid rgba(167,139,250,.3);border-radius:14px;padding:8px;overflow:auto}
canvas.px{display:block;image-rendering:pixelated;cursor:crosshair;max-width:100%;height:auto;border-radius:8px}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;background:rgba(45,17,71,.5);padding:10px;border-radius:14px;border:1px solid rgba(167,139,250,.15)}
.tool{padding:6px 11px;border:1px solid rgba(167,139,250,.3);background:rgba(139,92,246,.15);color:#fff;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.tool.on{background:linear-gradient(120deg,#7c3aed,#a855f7);border-color:transparent}
.tool.primary{background:linear-gradient(120deg,#7c3aed,#c026d3);border-color:transparent}
.tool.danger{background:linear-gradient(120deg,#dc2626,#991b1b);border-color:transparent}
.sidepanel{background:linear-gradient(160deg,rgba(45,17,71,.75),rgba(30,11,48,.75));border:1px solid rgba(167,139,250,.2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sidepanel h4{font-size:12px;color:#c4b5fd;letter-spacing:1.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sidepanel h4::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,#a78bfa,#c026d3)}
.info-item{font-size:12px;color:#c4b5fd;padding:5px 0;display:flex;justify-content:space-between;border-bottom:1px dashed rgba(167,139,250,.1)}
.info-item:last-child{border-bottom:none}
.info-item strong{color:#fff}
.events{max-height:340px;overflow-y:auto}
.events::-webkit-scrollbar{width:4px}
.events::-webkit-scrollbar-thumb{background:rgba(139,92,246,.3);border-radius:2px}
.ev{font-size:11.5px;color:#c4b5fd;padding:6px 9px;background:rgba(20,8,31,.5);border-radius:8px;border-left:3px solid var(--ec,#a78bfa);margin-bottom:5px;line-height:1.5}
.ev .time{font-size:10px;color:#8b7bb8;display:block;margin-top:2px}
canvas.snake{display:block;margin:0 auto;background:rgba(10,4,18,.9);border-radius:14px;border:2px solid rgba(167,139,250,.4);max-width:100%;height:auto;box-shadow:0 20px 60px -20px rgba(139,92,246,.6)}
.snake-hud{display:flex;justify-content:center;gap:24px;margin:16px 0;font-size:14px;color:#c4b5fd;font-weight:700;flex-wrap:wrap}
.snake-hud span{background:rgba(45,17,71,.7);padding:8px 18px;border-radius:12px;border:1px solid rgba(167,139,250,.2)}
.snake-hud strong{color:#fff;font-size:18px;margin-left:6px}
.snake-ctrl{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:8px;justify-content:center;margin-top:16px}
.dir-btn{background:rgba(139,92,246,.2);border:1px solid rgba(167,139,250,.35);border-radius:12px;color:#fff;font-size:22px;font-weight:900;cursor:pointer;font-family:inherit}
.dir-btn:active{background:rgba(139,92,246,.5)}
.dir-btn.up{grid-column:2;grid-row:1}
.dir-btn.left{grid-column:1;grid-row:2}
.dir-btn.down{grid-column:2;grid-row:2}
.dir-btn.right{grid-column:3;grid-row:2}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal.on{display:flex}
.mbox{background:linear-gradient(160deg,#2d1147,#1e0b30);border:1px solid rgba(167,139,250,.4);border-radius:20px;padding:24px;max-width:540px;width:100%;max-height:85vh;overflow:auto}
.mbox h3{margin-bottom:14px;color:#fff;font-size:18px;text-align:center}
.mbox .warn{margin:12px 0 16px}
.rule-list{font-size:13px;line-height:1.9;color:#c4b5fd;padding-left:18px;margin-bottom:16px}
.rule-list li{margin-bottom:4px}
.rule-list strong{color:#fff}
.mbox .row{gap:10px;margin-top:14px}
.mbox .row button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;cursor:pointer;font-family:inherit;font-size:13.5px;color:#fff}
</style>
</head>
<body>
<nav class="nav">
<span class="brand">六年二班</span>
<button class="btn active" data-v="home">首页</button>
<button class="btn" data-v="bubbles">关系图</button>
<button class="btn" data-v="score">加分</button>
<button class="btn" data-v="medal">勋章</button>
<button class="btn" data-v="cd">倒计时</button>
<button class="btn" data-v="pixel">像素世界</button>
<button class="btn" data-v="snake">贪吃蛇</button>
<button class="btn" data-v="teacher">老师</button>
</nav>

<div id="v-home" class="view active">
<h1 contenteditable="true" id="className">六年二班</h1>
<p class="gray" style="text-align:center;letter-spacing:3px" contenteditable="true" id="schoolName">北京邮电大学附属小学</p>
<div class="card" style="margin-top:30px">
<p contenteditable="true" id="introText" style="line-height:2;color:#c4b5fd"></p>
</div>
<p class="gray" style="text-align:center;margin-top:14px">点击文字即可编辑</p>
</div>

<div id="v-bubbles" class="view"><h2>🎈 班级关系图</h2><div class="grid" id="bubbleGrid"></div></div>

<div id="v-score" class="view">
<h2>🏆 个人加分</h2>
<div class="grid" id="scoreGrid"></div>
<h2 style="margin-top:30px">📋 加分记录</h2>
<div id="recordList"></div>
<h2 style="margin-top:30px">🥇 表扬前五</h2>
<div id="rankList"></div>
</div>

<div id="v-medal" class="view"><h2>🏅 荣誉勋章</h2><div id="medalList"></div></div>

<div id="v-cd" class="view">
<h2 style="text-align:center">⏳ 节日倒计时</h2>
<div class="cd">
<div style="font-size:60px" id="cdIcon">🎉</div>
<div style="font-size:24px;font-weight:900;color:#fff;margin:8px 0" id="cdName">元旦</div>
<div class="gray" id="cdDate">2027-01-01</div>
<div class="cd-grid">
<div class="cd-box"><div class="cd-num" id="cdD">0</div><div class="cd-label">天</div></div>
<div class="cd-box"><div class="cd-num" id="cdH">0</div><div class="cd-label">时</div></div>
<div class="cd-box"><div class="cd-num" id="cdM">0</div><div class="cd-label">分</div></div>
<div class="cd-box"><div class="cd-num" id="cdS">0</div><div class="cd-label">秒</div></div>
</div>
<div class="gray" style="margin-top:16px" id="cdTotal"></div>
</div>
<div id="festivalList" class="grid" style="margin-top:20px"></div>
</div>

<div id="v-pixel" class="view">
<h2>🌍 像素世界</h2>
<div class="warn">⚠️ 重要提醒：在校期间请勿游玩！<br>本功能仅供放学后、周末和假期在家使用。</div>
<div class="tools">
<button class="tool" data-g="male">👦 男生</button>
<button class="tool" data-g="female">👧 女生</button>
<span style="color:#8b7bb8;padding:6px 2px">|</span>
<button class="tool on" data-m="move">🚶 移动</button>
<button class="tool" data-b="house">🏠 小屋</button>
<button class="tool" data-b="castle">🏰 城堡</button>
<button class="tool" data-b="tree">🌳 树</button>
<button class="tool" data-b="flag">🚩 旗帜</button>
<button class="tool" data-b="erase">🗑️ 清除</button>
<button class="tool primary" id="makeNation">🏛️ 创建国家</button>
<button class="tool" id="pixelRules">📜 规则</button>
<button class="tool danger" id="pixelReset">🔄 重置世界</button>
</div>
<div class="pixel-layout">
<div class="pixel-canvas-wrap"><canvas class="px" id="pxCanvas"></canvas></div>
<div>
<div class="sidepanel"><h4>👤 我的信息</h4><div id="myInfo"></div></div>
<div class="sidepanel"><h4>🌐 世界事件</h4><div class="events" id="pxEvents"></div></div>
</div>
</div>
</div>

<div id="v-snake" class="view">
<h2 style="text-align:center">🐍 贪吃蛇</h2>
<div class="warn">⚠️ 在校期间请勿游玩！<br>本功能仅供放学后、周末和假期在家使用。</div>
<div class="snake-hud">
<span>得分 <strong id="snakeScore">0</strong></span>
<span>最高 <strong id="snakeBest">0</strong></span>
</div>
<canvas class="snake" id="snakeCanvas" width="480" height="480"></canvas>
<div class="snake-ctrl">
<button class="dir-btn up" data-d="up">▲</button>
<button class="dir-btn left" data-d="left">◀</button>
<button class="dir-btn down" data-d="down">▼</button>
<button class="dir-btn right" data-d="right">▶</button>
</div>
<div class="row" style="justify-content:center;margin-top:16px;max-width:340px;margin-left:auto;margin-right:auto">
<button class="mini" id="snakeStart" style="flex:1;padding:12px;font-size:14px">▶ 开始游戏</button>
<button class="mini" id="snakePause" style="flex:1;padding:12px;font-size:14px">⏸ 暂停</button>
<button class="mini" id="snakeRestart" style="flex:1;padding:12px;font-size:14px">🔄 重开</button>
</div>
</div>

<div id="v-teacher" class="view">
<h2 style="text-align:center">🎓 我们的老师</h2>
<div class="grid" id="teacherGrid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"></div>
</div>

<script>
/* ===== 数据 ===== */
const KEY='class62';
const DEF={
  className:'六年二班',schoolName:'北京邮电大学附属小学',
  intro:'六年二班是一个温暖又热闹的大家庭。我们在这里一起读书、一起运动、一起长大。\n\n北邮附小见证着我们的每一次进步，每一张笑脸都是班级最珍贵的风景。愿我们永远保持好奇与热爱，把这段时光写成最棒的故事。',
  people:['林小雨','陈子航','苏念','王浩','李思远','周佳怡','赵一鸣','孙悦','吴桐','郑亦然','刘星宇','何雨薇','马小跳','许安然','高一诺','黄子豪','徐一诺','曹雨欣','沈嘉树','韩雪','唐子墨','顾念','程宇航','卢佳琪','蒋子涵','宋雨桐','方启铭','秦悦','丁一','罗子谦','谢婉清','崔博文','潘星辰','汪雨萌','石天佑','龚心悦','白泽宇','钟灵','严子轩','熊思远','孔令仪','温子瑜','尹嘉树'].map((n,i)=>({id:'p'+i,name:n,score:0})),
  records:[],
  teachers:[
    {name:'王老师',subject:'语文',emoji:'👩‍🏫',flowers:0,hearts:0},
    {name:'李老师',subject:'数学',emoji:'👨‍🏫',flowers:0,hearts:0},
    {name:'张老师',subject:'英语',emoji:'👩‍🔬',flowers:0,hearts:0},
    {name:'刘老师',subject:'班主任',emoji:'🧑‍🏫',flowers:0,hearts:0},
    {name:'赵老师',subject:'音乐',emoji:'🧑‍🎤',flowers:0,hearts:0},
    {name:'孙老师',subject:'美术',emoji:'🎨',flowers:0,hearts:0}],
  pixel:{pid:null,name:'我',gender:null,x:25,y:15,buildings:{},nations:{},events:[],mode:'move',sel:null,colors:{}},
  snakeBest:0,pixelRulesSeen:false,snakeRulesSeen:false
};
let D=null;
try{ D=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!D||typeof D!=='object') D={};
/* 数据兜底 */
if(!D.className) D.className=DEF.className;
if(!D.schoolName) D.schoolName=DEF.schoolName;
if(!D.intro||D.intro==='undefined') D.intro=DEF.intro;
if(!Array.isArray(D.people)||!D.people.length) D.people=DEF.people;
D.people.forEach(p=>{ if(typeof p.score!=='number') p.score=0; });
if(!Array.isArray(D.records)) D.records=[];
if(!Array.isArray(D.teachers)||!D.teachers.length) D.teachers=DEF.teachers;
D.teachers.forEach(t=>{ if(typeof t.flowers!=='number')t.flowers=0; if(typeof t.hearts!=='number')t.hearts=0; });
if(!D.pixel||typeof D.pixel!=='object') D.pixel=JSON.parse(JSON.stringify(DEF.pixel));
if(!D.pixel.buildings) D.pixel.buildings={};
if(!D.pixel.nations) D.pixel.nations={};
if(!Array.isArray(D.pixel.events)) D.pixel.events=[];
if(!D.pixel.colors) D.pixel.colors={};
if(typeof D.snakeBest!=='number') D.snakeBest=0;
if(typeof D.pixelRulesSeen!=='boolean') D.pixelRulesSeen=false;
if(typeof D.snakeRulesSeen!=='boolean') D.snakeRulesSeen=false;
function save(){localStorage.setItem(KEY,JSON.stringify(D))}

/* ===== 导航 ===== */
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('v-'+b.dataset.v).classList.add('active');
  if(b.dataset.v==='pixel'){renderPixel();if(!D.pixelRulesSeen)showPixelRules()}
  if(b.dataset.v==='snake'){initSnake();if(!D.snakeRulesSeen)showSnakeRules()}
}));

/* ===== 首页 ===== */
['className','schoolName','introText'].forEach(id=>{
  const el=document.getElementById(id);
  el.innerText=D[id];
  el.addEventListener('blur',()=>{D[id]=el.innerText||'';save()});
});

/* ===== 加分 ===== */
function renderScore(){
  document.getElementById('scoreGrid').innerHTML=D.people.map(p=>`
    <div class="card">
      <div class="name">${p.name}</div>
      <div class="score">${p.score}</div>
      <div class="row">
        <button class="mini" onclick="addScore('${p.id}',1)">+1</button>
        <button class="mini" onclick="addScore('${p.id}',2)">+2</button>
        <button class="mini" onclick="addScore('${p.id}',5)">+5</button>
        <button class="mini minus" onclick="addScore('${p.id}',-1)">−1</button>
        <button class="mini" onclick="addScore('${p.id}','c')">＋?</button>
      </div>
    </div>`).join('');
  document.getElementById('recordList').innerHTML=D.records.length?D.records.slice(0,20).map(r=>`
    <div class="rec">
      <span class="delta ${r.d>0?'p':'m'}">${r.d>0?'+':''}${r.d}</span>
      <span class="name" style="min-width:60px">${r.name}</span>
      <span class="gray" style="flex:1">${r.reason||''}</span>
      <span class="gray">${new Date(r.t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
      <button class="mini" style="flex:0;min-width:auto" onclick="undoRec(${r.t})">撤销</button>
    </div>`).join(''):'<div class="empty">还没有记录</div>';
  const ranked=[...D.people].filter(p=>p.score>0).sort((a,b)=>b.score-a.score).slice(0,5);
  document.getElementById('rankList').innerHTML=ranked.length?ranked.map((p,i)=>`
    <div class="rec">
      <span style="font-size:20px">${['🥇','🥈','🥉','',''][i]||''}</span>
      <span class="name" style="flex:1">${p.name}</span>
      <span class="delta p">+${p.score}</span>
    </div>`).join(''):'<div class="empty">还没有人加分</div>';
}
window.addScore=function(id,d){
  const p=D.people.find(x=>x.id===id);if(!p)return;
  if(d==='c'){const n=Number(prompt('加减分：','3'));if(!n)return;d=n}
  d=Number(d);if(!d)return;
  p.score+=d;
  const reason=prompt('原因（可选）：','')||(d>0?'表现优秀':'违反纪律');
  D.records.unshift({name:p.name,d,reason,t:Date.now()});
  if(D.records.length>200)D.records=D.records.slice(0,200);
  save();renderScore();renderMedal();
};
window.undoRec=function(t){
  const i=D.records.findIndex(r=>r.t===t);if(i<0)return;
  const r=D.records[i];const p=D.people.find(x=>x.name===r.name);
  if(p)p.score-=r.d;D.records.splice(i,1);save();renderScore();renderMedal();
};

/* ===== 勋章 ===== */
const MEDALS=[{i:'🥉',n:'铜牌',s:5,c:'#d97706'},{i:'🥈',n:'银牌',s:15,c:'#cbd5e1'},{i:'🥇',n:'金牌',s:30,c:'#fbbf24'},{i:'💎',n:'钻石',s:50,c:'#67e8f9'},{i:'👑',n:'传说',s:100,c:'#f0abfc'}];
function renderMedal(){
  const top=[...D.people].sort((a,b)=>b.score-a.score).slice(0,10);
  document.getElementById('medalList').innerHTML=top.map(p=>{

const FEST=[{n:'元旦',i:'🎉',m:1,d:1},{n:'儿童节',i:'🎈',m:6,d:1},{n:'劳动节',i:'💪',m:5,d:1},{n:'国庆节',i:'🇨🇳',m:10,d:1},{n:'圣诞节',i:'🎄',m:12,d:25}];

  const now=new Date(),y=now.getFullYear(),today=new Date(y,now.getMonth(),now.getDate());
  const list=FEST.map(f=>{let d=new Date(y,f.m-1,f.d);if(d<today)d=new Date(y+1,f.m-1,f.d);return{...f,date:d,y:d.getFullYear()}}).sort((a,b)=>a.date-b.date);
  const n=list[0],diff=Math.max(0,n.date-now);
  const dd=Math.floor(diff/86400000),hh=Math.floor(diff%86400000/3600000),mm=Math.floor(diff%3600000/60000),ss=Math.floor(diff%60000/1000);
  document.getElementById('cdD').textContent=String(dd).padStart(2,'0');
  document.getElementById('cdH').textContent=String(hh).padStart(2,'0');
  document.getElementById('cdM').textContent=String(mm).padStart(2,'0');

  document.getElementById('cdDate').textContent=n.y+'-'+String(n.m).padStart(2,'0')+'-'+String(n.d).padStart(2,'0');
  document.getElementById('cdTotal').textContent='距离'+n.n+'还有 '+dd+' 天';
  document.getElementById('festivalList').innerHTML=list.map(f=>{
    const d=Math.max(0,Math.ceil((f.date-now)/86400000));
    return `<div class="card"><div style="font-size:32px">${f.i}</div><div class="name">${f.n}</div><div class="gray">${d===0?'就是今天':d+' 天后'}</div></div>`;

/* ===== 像素世界 ===== */
const PW=50,PH=30,PS=16;
const canvas=document.getElementById('pxCanvas');
const ctx=canvas.getContext('2d');
canvas.width=PW*PS;canvas.height=PH*PS;
const BUILD_NAMES={house:'小屋',castle:'城堡',tree:'树',flag:'旗帜'};
const NC=['#f87171','#fb923c','#fbbf24','#a3e635','#34d399','#22d3ee','#60a5fa','#a78bfa','#e879f9','#f472b6'];
function addEvent(t,color){
  D.pixel.events.unshift({t,color:color||'#a78bfa',time:Date.now()});
  if(D.pixel.events.length>50)D.pixel.events=D.pixel.events.slice(0,50);
}
function K(x,y){return x+','+y}
function findMyPerson(){
  for(const k in D.pixel.buildings){
    const b=D.pixel.buildings[k];
    if(b.type==='person'&&b.pid===D.pixel.pid)return k;
  }
  return null;
}
function renderPixel(){
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'#166534');g.addColorStop(1,'#14532d');
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let x=0;x<=PW;x++){ctx.beginPath();ctx.moveTo(x*PS,0);ctx.lineTo(x*PS,canvas.height);ctx.stroke()}
  for(let y=0;y<=PH;y++){ctx.beginPath();ctx.moveTo(0,y*PS);ctx.lineTo(canvas.width,y*PS);ctx.stroke()}
  for(const k in D.pixel.buildings){
    const b=D.pixel.buildings[k];
    if(b.type==='person'&&b.nation&&D.pixel.nations[b.nation]){
      const[x,y]=k.split(',').map(Number);
      ctx.fillStyle=D.pixel.nations[b.nation].color+'22';
      ctx.fillRect((x-3)*PS,(y-3)*PS,7*PS,7*PS);
      ctx.strokeStyle=D.pixel.nations[b.nation].color+'66';ctx.lineWidth=2;
      ctx.strokeRect((x-3)*PS+1,(y-3)*PS+1,7*PS-2,7*PS-2);
    }
  }
  for(const k in D.pixel.buildings){
    const[x,y]=k.split(',').map(Number);
    const b=D.pixel.buildings[k];
    const px=x*PS,py=y*PS;
    if(b.type==='person'){
      ctx.fillStyle=b.gender==='female'?'#f472b6':'#60a5fa';
      ctx.fillRect(px+2,py+2,PS-4,PS-4);
      ctx.fillStyle='#fff';ctx.fillRect(px+4,py+5,2,2);ctx.fillRect(px+PS-6,py+5,2,2);
      if(b.nation&&D.pixel.nations[b.nation]){
        ctx.fillStyle=D.pixel.nations[b.nation].color;
        ctx.fillRect(px+PS/2-1,py-3,2,4);
      }
      if(b.pid===D.pixel.pid){
        ctx.strokeStyle='#fef08a';ctx.lineWidth=2;
        ctx.strokeRect(px+1,py+1,PS-2,PS-2);
      }
    }else if(b.type==='house'){
      ctx.fillStyle='#d97706';ctx.fillRect(px+3,py+8,PS-6,PS-9);
      ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(px+1,py+8);ctx.lineTo(px+PS/2,py+2);ctx.lineTo(px+PS-1,py+8);ctx.fill();
      ctx.fillStyle='#fde68a';ctx.fillRect(px+6,py+11,3,3);
    }else if(b.type==='castle'){
      ctx.fillStyle='#a78bfa';ctx.fillRect(px+1,py+5,PS-2,PS-7);
      ctx.fillStyle='#c4b5fd';
      ctx.fillRect(px+2,py+3,3,3);ctx.fillRect(px+PS/2-1.5,py+3,3,3);ctx.fillRect(px+PS-5,py+3,3,3);
      ctx.fillStyle='#fef3c7';ctx.fillRect(px+4,py+9,3,3);ctx.fillRect(px+PS-7,py+9,3,3);
    }else if(b.type==='tree'){
      ctx.fillStyle='#78350f';ctx.fillRect(px+PS/2-2,py+9,4,PS-10);
      ctx.fillStyle='#16a34a';ctx.beginPath();ctx.arc(px+PS/2,py+7,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(px+PS/2-2,py+5,3,0,Math.PI*2);ctx.fill();
    }else if(b.type==='flag'){
      ctx.fillStyle='#78350f';ctx.fillRect(px+PS/2-1,py+3,2,PS-5);
      ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(px+PS/2+1,py+4);ctx.lineTo(px+PS-2,py+7);ctx.lineTo(px+PS/2+1,py+10);ctx.fill();
    }
  }
  const myKey=findMyPerson();
  const myBuild=Object.values(D.pixel.buildings).filter(b=>b.type!=='person'&&b.pid===D.pixel.pid).length;
  const myNation=Object.values(D.pixel.nations).find(n=>n.king===D.pixel.pid);
  let info='';
  if(D.pixel.gender){
    info+=`<div class="info-item"><span>性别</span><strong>${D.pixel.gender==='female'?'👧 女生':'👦 男生'}</strong></div>`;
    info+=`<div class="info-item"><span>坐标</span><strong>${myKey?'('+myKey+')':'未出现'}</strong></div>`;
    info+=`<div class="info-item"><span>建筑</span><strong>${myBuild} / 20</strong></div>`;
    info+=`<div class="info-item"><span>国家</span><strong>${myNation?myNation.name:'无'}</strong></div>`;
  }else{info='<div class="gray">还没有选性别，先点上方 👦/👧</div>'}
  document.getElementById('myInfo').innerHTML=info;
  document.getElementById('pxEvents').innerHTML=D.pixel.events.length?
    D.pixel.events.slice(0,20).map(e=>`<div class="ev" style="--ec:${e.color}">${e.t}<span class="time">${new Date(e.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')
    :'<div class="gray">还没有事件</div>';
}
function ensureMyPerson(){
  if(!D.pixel.pid)D.pixel.pid='px'+Date.now()+Math.random().toString(36).slice(2,6);
  if(findMyPerson())return;
  for(let tries=0;tries<1000;tries++){
    const x=Math.floor(Math.random()*PW),y=Math.floor(Math.random()*PH);
    if(!D.pixel.buildings[K(x,y)]){
      D.pixel.buildings[K(x,y)]={type:'person',pid:D.pixel.pid,gender:D.pixel.gender||'male'};
      D.pixel.x=x;D.pixel.y=y;
      addEvent('👤 '+D.pixel.name+' 来到了像素世界','#86efac');
      return;
    }
  }
}
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*PW);
  const y=Math.floor((e.clientY-r.top)/r.height*PH);
  if(x<0||x>=PW||y<0||y>=PH)return;
  const k=K(x,y);
  const b=D.pixel.buildings[k];
  if(b&&b.type==='person'&&b.pid!==D.pixel.pid){openInteraction(b,k);return}
  if(b&&b.type==='person'&&b.pid===D.pixel.pid)return;
  if(!D.pixel.gender){alert('请先选择 👦 男生 或 👧 女生');return}
  if(D.pixel.mode==='move'){
    if(b){alert('这里已经有东西了~');return}
    const old=findMyPerson();
    const oldN=old?D.pixel.buildings[old].nation:null;
    if(old)delete D.pixel.buildings[old];
    D.pixel.buildings[k]={type:'person',pid:D.pixel.pid,gender:D.pixel.gender,nation:oldN};
    D.pixel.x=x;D.pixel.y=y;
    addEvent('🚶 移动到 ('+x+','+y+')','#60a5fa');
    save();renderPixel();return;
  }
  if(D.pixel.mode==='erase'){
    if(!b)return;
    if(b.type==='person'){alert('不能清除小人~');return}
    delete D.pixel.buildings[k];
    addEvent('🗑️ 清除了一处建筑','#fca5a5');
    save();renderPixel();return;
  }
  if(D.pixel.sel){
    if(b){alert('这里已经有东西了~');return}
    const myBuild=Object.values(D.pixel.buildings).filter(x=>x.type!=='person'&&x.pid===D.pixel.pid).length;
    if(myBuild>=20){alert('每人最多建造 20 个建筑~');return}
    D.pixel.buildings[k]={type:D.pixel.sel,pid:D.pixel.pid};
    addEvent('🏗️ 建造了'+BUILD_NAMES[D.pixel.sel]);
    save();renderPixel();return;
  }
});
function openInteraction(target,k){
  const isKing=!!target.nation&&D.pixel.nations[target.nation]&&D.pixel.nations[target.nation].king===target.pid;
  const m=makeModal(`<div class="mbox">
    <h3>👤 你对 TA 想做什么？</h3>
    <div class="row">
      ${isKing?`<button style="background:linear-gradient(135deg,#dc2626,#991b1b)" id="actWar">⚔️ 宣战</button>`:''}
      ${isKing?`<button style="background:linear-gradient(135deg,#16a34a,#15803d)" id="actAlly">🤝 结盟</button>`:''}
      <button style="background:linear-gradient(135deg,#f472b6,#ec4899)" id="actFlower">💐 送花</button>

/* ===== 贪吃蛇 ===== */
const SW=480,SH=480,GRID=24,CELL=SW/GRID;
const sCanvas=document.getElementById('snakeCanvas');
const sCtx=sCanvas.getContext('2d');
let snake=[],food={x:0,y:0},dir={x:1,y:0},nextDir={x:1,y:0},snakeScore=0,snakeRunning=false,snakePaused=false,snakeTimer=null,snakeOver=false;
function initSnake(){
  document.getElementById('snakeBest').textContent=D.snakeBest||0;
  resetSnake();drawSnake();
}
function resetSnake(){
  snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  snakeScore=0;snakeOver=false;snakeRunning=false;snakePaused=false;
  document.getElementById('snakeScore').textContent=0;
  document.getElementById('snakeBest').textContent=D.snakeBest||0;
  placeFood();
  if(snakeTimer){clearInterval(snakeTimer);snakeTimer=null}
  drawSnake();
}
function placeFood(){
  let t=0;
  while(t++<500){
    const f={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};
    if(!snake.some(s=>s.x===f.x&&s.y===f.y)){food=f;return}
  }
}
function drawSnake(){
  sCtx.fillStyle='#0a0412';sCtx.fillRect(0,0,SW,SH);
  sCtx.strokeStyle='rgba(167,139,250,.06)';
  for(let x=0;x<=GRID;x++){sCtx.beginPath();sCtx.moveTo(x*CELL,0);sCtx.lineTo(x*CELL,SH);sCtx.stroke()}
  for(let y=0;y<=GRID;y++){sCtx.beginPath();sCtx.moveTo(0,y*CELL);sCtx.lineTo(SW,y*CELL);sCtx.stroke()}
  sCtx.fillStyle='#f472b6';
  sCtx.beginPath();sCtx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);sCtx.fill();
  sCtx.fillStyle='#fbcfe8';
  sCtx.beginPath();sCtx.arc(food.x*CELL+CELL/2-2,food.y*CELL+CELL/2-2,2,0,Math.PI*2);sCtx.fill();
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    sCtx.fillStyle=i===0?'#fbbf24':`rgba(167,139,250,${1-t*0.5})`;
    sCtx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    if(i===0){
      sCtx.fillStyle='#1a0a2a';
      sCtx.fillRect(s.x*CELL+5,s.y*CELL+6,3,3);
      sCtx.fillRect(s.x*CELL+CELL-8,s.y*CELL+6,3,3);
    }
  });
  if(snakeOver){
    sCtx.fillStyle='rgba(10,4,18,.85)';sCtx.fillRect(0,0,SW,SH);
    sCtx.fillStyle='#fca5a5';sCtx.font='bold 32px "PingFang SC"';sCtx.textAlign='center';
    sCtx.fillText('游戏结束',SW/2,SH/2-20);
    sCtx.font='bold 20px "PingFang SC"';sCtx.fillStyle='#c4b5fd';
    sCtx.fillText('得分 '+snakeScore,SW/2,SH/2+20);
    sCtx.fillText('点「重开」再来一局',SW/2,SH/2+55);
  }
  if(snakePaused&&!snakeOver){
    sCtx.fillStyle='rgba(10,4,18,.7)';sCtx.fillRect(0,0,SW,SH);
    sCtx.fillStyle='#f0abfc';sCtx.font='bold 28px "PingFang SC"';sCtx.textAlign='center';
    sCtx.fillText('已暂停',SW/2,SH/2);
  }
}
function stepSnake(){
  if(!snakeRunning||snakePaused||snakeOver)return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){
    snakeOver=true;snakeRunning=false;
    if(snakeTimer){clearInterval(snakeTimer);snakeTimer=null}
    if(snakeScore>(D.snakeBest||0)){D.snakeBest=snakeScore;save()}
    document.getElementById('snakeBest').textContent=D.snakeBest||0;
    drawSnake();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    snakeScore++;document.getElementById('snakeScore').textContent=snakeScore;placeFood();
  }else{snake.pop()}
  drawSnake();
}
document.getElementById('snakeStart').addEventListener('click',()=>{
  if(snakeOver)resetSnake();
  if(snakeRunning&&snakePaused){snakePaused=false;drawSnake();return}
  snakeRunning=true;snakePaused=false;
  if(snakeTimer)clearInterval(snakeTimer);
  snakeTimer=setInterval(stepSnake,140);
  drawSnake();
});
document.getElementById('snakePause').addEventListener('click',()=>{
  if(!snakeRunning||snakeOver)return;
  snakePaused=!snakePaused;drawSnake();
});
document.getElementById('snakeRestart').addEventListener('click',resetSnake);
document.querySelectorAll('.dir-btn').forEach(b=>b.addEventListener('click',()=>{
  const d=b.dataset.d;
  if(d==='up'&&dir.y!==1)nextDir={x:0,y:-1};
  if(d==='down'&&dir.y!==-1)nextDir={x:0,y:1};
  if(d==='left'&&dir.x!==1)nextDir={x:-1,y:0};
  if(d==='right'&&dir.x!==-1)nextDir={x:1,y:0};
}));
document.addEventListener('keydown',e=>{
  if(!document.getElementById('v-snake').classList.contains('active'))return;
  if(e.key==='ArrowUp'&&dir.y!==1){e.preventDefault();nextDir={x:0,y:-1}}
  if(e.key==='ArrowDown'&&dir.y!==-1){e.preventDefault();nextDir={x:0,y:1}}
  if(e.key==='ArrowLeft'&&dir.x!==1){e.preventDefault();nextDir={x:-1,y:0}}
  if(e.key==='ArrowRight'&&dir.x!==-1){e.preventDefault();nextDir={x:1,y:0}}
});
let tsX=0,tsY=0;
sCanvas.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY},{passive:true});
sCanvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0&&dir.x!==-1)nextDir={x:1,y:0};
    else if(dx<0&&dir.x!==1)nextDir={x:-1,y:0};
  }else{
    if(dy>0&&dir.y!==-1)nextDir={x:0,y:1};
    else if(dy<0&&dir.y!==1)nextDir={x:0,y:-1};
  }
},{passive:true});
function showSnakeRules(){
  const m=makeModal(`<div class="mbox">
    <h3>🐍 贪吃蛇 · 玩法说明</h3>
    <div class="warn">⚠️ 在校期间请勿游玩！<br>仅供放学后、周末和假期在家使用。</div>
    <ul class="rule-list">
      <li><strong>操作</strong>：键盘方向键 / 屏幕按钮 / 滑动屏幕</li>
      <li><strong>目标</strong>：吃到粉色食物，每个 +1 分</li>
      <li><strong>失败</strong>：撞墙或撞到自己身体</li>
      <li><strong>最高分</strong>：永久记录，刷新不丢</li>
    </ul>
    <p class="gray" style="text-align:center">适度游戏益脑，沉迷伤身～</p>
    <div class="row"><button style="background:linear-gradient(120deg,#7c3aed,#c026d3)" id="snakeAgree">我已阅读，开始游戏</button></div>
  </div>`);
  m.querySelector('#snakeAgree').addEventListener('click',()=>{D.snakeRulesSeen=true;save();m.remove()});
}

/* ===== 启动 ===== */
renderScore();renderMedal();renderBubbles();renderTeacher();renderPixel();initSnake();
</script>
