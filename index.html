<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六年二班 · 班级主页</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--border:rgba(167,139,250,.18);--border-strong:rgba(167,139,250,.38);--primary:#8b5cf6;--primary-light:#a78bfa;--primary-lighter:#c4b5fd;--accent-light:#f0abfc;--text:#f3e8ff;--text-dim:#c4b5fd;--text-muted:#8b7bb8}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:radial-gradient(1000px 700px at 15% 0%,rgba(124,58,237,.28),transparent 60%),radial-gradient(900px 600px at 85% 20%,rgba(217,70,239,.16),transparent 60%),radial-gradient(1000px 800px at 50% 100%,rgba(91,33,182,.32),transparent 65%),linear-gradient(180deg,#14081f,#1e0b30);background-attachment:fixed;overflow-x:hidden}
.navbar{position:fixed;top:0;left:0;right:0;height:68px;z-index:200;display:flex;align-items:center;gap:20px;padding:0 26px;background:rgba(20,8,31,.72);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;flex-shrink:0}
.nav-logo{width:38px;height:38px;flex:0 0 38px;filter:drop-shadow(0 4px 10px rgba(167,139,250,.45));transition:.3s}
.nav-brand:hover .nav-logo{transform:rotate(-8deg) scale(1.06)}
.nav-title{font-size:17px;font-weight:800;letter-spacing:.6px;background:linear-gradient(120deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.nav-sub{font-size:11px;color:var(--text-muted);letter-spacing:1.5px;white-space:nowrap}
.nav-links{display:flex;gap:6px;margin-left:auto;background:rgba(139,92,246,.10);padding:5px;border-radius:999px;border:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:.4px;padding:8px 18px;border-radius:999px;background:transparent;color:var(--text-dim);transition:.25s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:rgba(139,92,246,.18)}
.nav-link.active{color:#fff;background:linear-gradient(120deg,#7c3aed,#a855f7);box-shadow:0 6px 18px -6px rgba(139,92,246,.9)}
.view{display:none}.view.active{display:block}
#view-home{min-height:100vh;padding:120px 24px 70px;display:flex;align-items:center;justify-content:center}
.home-wrap{width:min(820px,100%);text-align:center;animation:fadeUp .8s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.home-logo{width:172px;height:172px;margin:0 auto 26px;display:block;filter:drop-shadow(0 22px 50px rgba(139,92,246,.55));animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-title{font-size:clamp(34px,6vw,52px);font-weight:900;letter-spacing:3px;margin:0 0 10px;background:linear-gradient(120deg,#ddd6fe,#c4b5fd,#f0abfc,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent;outline:none;border-radius:12px;padding:4px 16px;cursor:text;transition:.25s}
.hero-sub{font-size:15.5px;letter-spacing:4px;font-weight:600;color:var(--primary-lighter);margin:0 0 34px;outline:none;cursor:text;border-radius:10px;padding:4px 12px;display:inline-block;transition:.25s}
.hero-title:focus,.hero-sub:focus{background:rgba(139,92,246,.22);box-shadow:0 0 0 2px rgba(167,139,250,.45)}
.intro-card{position:relative;background:rgba(45,17,71,.72);border:1px solid var(--border);border-radius:26px;padding:36px 38px;text-align:left;backdrop-filter:blur(16px);box-shadow:0 30px 70px -28px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
.intro-card::before{content:"班级简介";position:absolute;top:-12px;left:32px;font-size:12px;font-weight:800;letter-spacing:2.5px;color:#fff;background:linear-gradient(120deg,#7c3aed,#c026d3);padding:5px 16px;border-radius:999px;box-shadow:0 8px 20px -8px rgba(139,92,246,.9)}
.hero-intro{font-size:15.5px;line-height:2.05;color:var(--text-dim);margin:0;white-space:pre-wrap;word-break:break-word;outline:none;cursor:text;border-radius:12px;padding:8px 10px;min-height:80px;transition:.25s}
.hero-intro:focus{background:rgba(139,92,246,.14);box-shadow:0 0 0 2px rgba(167,139,250,.35)}
.edit-tip{margin-top:22px;font-size:12px;color:var(--text-muted);letter-spacing:1.2px;display:flex;align-items:center;justify-content:center;gap:7px}
.edit-tip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-light);box-shadow:0 0 10px var(--accent-light);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
#view-bubbles{position:relative;height:100vh;padding-top:68px}
#view-bubbles .stage{position:relative;width:100%;height:100%;overflow:hidden}
.bubble{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 58%),var(--c);box-shadow:0 12px 30px -8px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08),inset 0 -8px 18px rgba(255,255,255,.28),inset 0 4px 10px rgba(255,255,255,.4);transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s;will-change:transform;animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards;user-select:none}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.bubble:hover{transform:scale(1.09);box-shadow:0 22px 48px -12px rgba(0,0,0,.7),0 0 0 8px rgba(167,139,250,.28),0 0 0 2px rgba(240,171,252,.5);z-index:10}
.bubble:active{transform:scale(.96)}
.bub-emoji{line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.bub-name{font-weight:800;line-height:1.1;letter-spacing:.3px;text-shadow:0 1px 2px rgba(255,255,255,.55);color:#2e1065}
.overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(20,8,31,.78);backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:.3s}
.overlay.open{opacity:1;pointer-events:auto}
.card{position:relative;width:min(1000px,100%);max-height:calc(100vh - 48px);overflow:auto;display:grid;grid-template-columns:1fr 1.05fr;gap:32px;padding:38px 40px;border-radius:30px;background:linear-gradient(160deg,rgba(45,17,71,.96),rgba(30,11,48,.96));border:1px solid var(--border-strong);box-shadow:0 40px 100px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);transform:translateY(18px) scale(.97);transition:.38s}
.overlay.open .card{transform:none}
.close-btn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);cursor:pointer;background:rgba(139,92,246,.14);color:var(--text-dim);font-size:15px;line-height:1;transition:.25s;z-index:2}
.close-btn:hover{background:rgba(139,92,246,.3);color:#fff;transform:rotate(90deg)}
.p-left{display:flex;flex-direction:column;align-items:flex-start}
.big-avatar{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:20px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7),0 0 0 3px rgba(167,139,250,.25),inset 0 -8px 20px rgba(255,255,255,.3);animation:floaty 4s ease-in-out infinite}
.p-name{font-size:28px;font-weight:900;margin:0 0 10px;color:#fff}
.p-tags{margin-bottom:16px;min-height:24px}
.tag{display:inline-block;padding:4px 12px;margin:0 6px 6px 0;border-radius:999px;background:rgba(139,92,246,.2);border:1px solid rgba(167,139,250,.3);color:var(--primary-lighter);font-size:12.5px;font-weight:700}
.p-intro{font-size:15px;line-height:1.9;color:var(--text-dim);margin:0 0 24px;white-space:pre-wrap;word-break:break-word}
.p-meta{font-size:12.5px;color:var(--text-muted);margin-bottom:22px}
.btn-edit{border:none;cursor:pointer;font-family:inherit;padding:11px 24px;border-radius:999px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(120deg,#7c3aed,#c026d3);box-shadow:0 12px 28px -10px rgba(139,92,246,.95);transition:.22s}
.btn-edit:hover{transform:translateY(-2px)}
.p-right{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px}
.p-right h3{margin:0 0 4px;font-size:13px;color:var(--text-muted);font-weight:800;letter-spacing:3px}
#relGraph{width:100%;height:auto;display:block}
.modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,4,18,.72);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.25s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{width:min(580px,100%);max-height:88vh;overflow:auto;background:linear-gradient(160deg,#2d1147,#1e0b30);border:1px solid var(--border-strong);border-radius:24px;padding:30px;box-shadow:0 40px 90px -25px rgba(0,0,0,.95);transform:scale(.96);transition:.28s;color:var(--text);position:relative}
.modal.open .modal-box{transform:none}
.modal-box h3{margin:0 0 22px;font-size:18px;font-weight:800;color:#fff}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12.5px;font-weight:800;color:var(--text-muted);margin-bottom:7px}
.field input,.field textarea,.rel-row select,.rel-row input[type=text]{width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(167,139,250,.2);background:rgba(20,8,31,.6);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.rel-row select:focus,.rel-row input[type=text]:focus{border-color:var(--primary-light);background:rgba(20,8,31,.9);box-shadow:0 0 0 4px rgba(139,92,246,.22)}
.field textarea{resize:vertical;min-height:84px;line-height:1.7}
.row2{display:grid;grid-template-columns:1fr 110px;gap:12px}
.rel-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.rel-head span{font-size:12.5px;font-weight:800;color:var(--text-muted)}
.btn-add{border:1px dashed rgba(167,139,250,.45);background:rgba(139,92,246,.14);color:var(--primary-lighter);font-family:inherit;font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.2s}
.btn-add:hover{background:rgba(139,92,246,.3);color:#fff}
.rel-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.rel-row select{flex:0 0 122px;padding:9px 10px;font-size:13px}
.rel-row input[type=text]{flex:1 1 60px;min-width:0;padding:9px 12px;font-size:13px}
.rel-row input[type=range]{flex:0 0 72px;accent-color:var(--primary-light)}
.rel-del{flex:0 0 30px;height:30px;border-radius:50%;border:none;background:rgba(239,68,68,.15);color:#fca5a5;cursor:pointer;font-size:12px;transition:.2s}
.rel-del:hover{background:rgba(239,68,68,.32)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid rgba(167,139,250,.16)}
.modal-actions button{font-family:inherit;font-size:14px;font-weight:800;padding:10px 24px;border-radius:12px;cursor:pointer;border:none;transition:.2s}
.btn-cancel{background:rgba(139,92,246,.14);color:var(--text-dim)}
.btn-cancel:hover{background:rgba(139,92,246,.26);color:#fff}
.btn-save{background:linear-gradient(120deg,#7c3aed,#c026d3);color:#fff;box-shadow:0 12px 26px -10px rgba(139,92,246,.95)}
.btn-save:hover{transform:translateY(-2px)}
#view-score{min-height:100vh;padding:104px 24px 70px}
.score-wrap{max-width:1280px;margin:0 auto}
.score-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.score-header h2{font-size:26px;margin:0;background:linear-gradient(120deg,#ddd6fe,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;letter-spacing:2px;display:flex;align-items:center;gap:12px}
.score-header h2 .ico{font-size:24px;filter:drop-shadow(0 4px 12px rgba(240,171,252,.6))}
.score-header-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.score-search{border:1px solid var(--border-strong);background:rgba(139,92,246,.12);color:var(--text);font-family:inherit;padding:9px 18px;border-radius:999px;outline:none;font-size:13px;width:190px;transition:.2s}
.score-search:focus{background:rgba(139,92,246,.22);border-color:var(--primary-light);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.score-btn{border:1px solid var(--border-strong);background:rgba(139,92,246,.14);color:var(--primary-lighter);font-family:inherit;font-size:13px;font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap}
.score-btn:hover{background:rgba(139,92,246,.3);color:#fff}
.score-btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1)}
.score-btn.danger:hover{background:rgba(239,68,68,.25);color:#fff}
.students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:36px}
.student-card{position:relative;background:linear-gradient(160deg,rgba(45,17,71,.9),rgba(30,11,48,.9));border:1px solid var(--border);border-radius:20px;padding:16px;overflow:hidden;transition:.3s;box-shadow:0 16px 40px -22px rgba(0,0,0,.7)}
.student-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,#a78bfa);box-shadow:0 0 16px -2px var(--c,#a78bfa)}
.student-card:hover{border-color:var(--border-strong);transform:translateY(-3px)}
.student-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.student-avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 14px -4px rgba(0,0,0,.55),inset 0 -4px 10px rgba(255,255,255,.2),inset 0 2px 6px rgba(255,255,255,.35);background:var(--c,#a78bfa)}
.student-info{flex:1;min-width:0}
.student-name{font-size:15px;font-weight:800;color:#fff;outline:none;border-radius:6px;padding:2px 6px;margin-left:-6px;transition:.2s;cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.student-name:focus{background:rgba(139,92,246,.2);box-shadow:0 0 0 2px rgba(167,139,250,.4)}
.student-tags{font-size:10.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.student-score-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px}
.student-score-label{font-size:10.5px;color:var(--text-muted);letter-spacing:1.5px;font-weight:700}
.student-score{font-size:26px;font-weight:900;color:var(--c,#a78bfa);text-shadow:0 0 18px var(--c,#a78bfa);font-variant-numeric:tabular-nums;line-height:1}
.student-add{display:flex;gap:5px;flex-wrap:wrap}
.score-add-btn{flex:1 1 34px;border:1px solid rgba(167,139,250,.3);background:rgba(139,92,246,.15);color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;padding:7px 0;border-radius:10px;cursor:pointer;transition:.2s;font-variant-numeric:tabular-nums;min-width:0}
.score-add-btn:hover{background:rgba(139,92,246,.4);border-color:var(--primary-light);transform:translateY(-1px)}
.score-add-btn.minus{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.12);color:#fca5a5}
.score-add-btn.minus:hover{background:rgba(239,68,68,.3);border-color:rgba(239,68,68,.6);color:#fff}
.records-section{background:linear-gradient(160deg,rgba(45,17,71,.7),rgba(30,11,48,.7));border:1px solid var(--border);border-radius:24px;padding:26px 28px;backdrop-filter:blur(12px);margin-bottom:24px}
.records-section h3{font-size:16px;margin:0 0 18px;color:var(--text-dim);letter-spacing:2px;font-weight:800;display:flex;align-items:center;gap:10px}
.records-section h3::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#a78bfa,#c026d3)}
.records-section h3 .count{font-size:12px;color:var(--text-muted);font-weight:600;letter-spacing:0;margin-left:auto}
.records-list{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow-y:auto;padding-right:6px}
.records-list::-webkit-scrollbar{width:6px}
.records-list::-webkit-scrollbar-thumb{background:rgba(139,92,246,.35);border-radius:3px}
.record-item{display:flex;align-items:center;gap:12px;padding:11px 16px;background:rgba(20,8,31,.5);border:1px solid rgba(167,139,250,.1);border-radius:12px;font-size:13.5px;animation:slideIn .35s ease backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.record-delta{font-weight:900;font-size:15px;min-width:52px;font-variant-numeric:tabular-nums;text-align:center;flex-shrink:0}
.record-delta.plus{color:#86efac}
.record-delta.minus{color:#fca5a5}
.record-avatar{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.record-student{font-weight:700;color:var(--primary-lighter);min-width:60px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.record-reason{flex:1;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.record-time{font-size:11.5px;color:#a78bfa;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;background:rgba(139,92,246,.12);padding:3px 9px;border-radius:8px;border:1px solid rgba(167,139,250,.18)}
.record-undo{border:none;background:rgba(139,92,246,.15);color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer;transition:.2s;flex-shrink:0}
.record-undo:hover{background:rgba(139,92,246,.4);color:#fff}
.empty-records{text-align:center;color:var(--text-muted);font-size:13px;padding:34px 0;letter-spacing:1px}
.empty-records .ico{display:block;font-size:32px;margin-bottom:10px;opacity:.5}
.leaderboard-section{background:linear-gradient(160deg,rgba(91,33,182,.35),rgba(45,17,71,.85));border:1px solid rgba(240,171,252,.25);border-radius:24px;padding:26px 28px;backdrop-filter:blur(14px);box-shadow:0 20px 60px -28px rgba(240,171,252,.45);position:relative;overflow:hidden}
.leaderboard-section::before{content:"";position:absolute;top:-50%;right:-20%;width:340px;height:340px;background:radial-gradient(circle,rgba(240,171,252,.22),transparent 65%);pointer-events:none}
.leaderboard-section h3{font-size:16px;margin:0 0 20px;color:#fff;letter-spacing:2px;font-weight:800;display:flex;align-items:center;gap:10px;position:relative}
.leaderboard-section h3::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#fbbf24,#f0abfc);box-shadow:0 0 12px rgba(251,191,36,.7)}
.leaderboard-section h3 .hint{font-size:11.5px;color:var(--text-muted);font-weight:600;letter-spacing:0;margin-left:auto}
.leaderboard-list{display:flex;flex-direction:column;gap:10px;position:relative}
.leaderboard-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:rgba(20,8,31,.55);border:1px solid rgba(167,139,250,.12);transition:.28s;animation:slideIn .4s ease backwards;position:relative;overflow:hidden}
.leaderboard-item:hover{border-color:var(--border-strong);transform:translateX(6px);background:rgba(20,8,31,.75)}
.leaderboard-rank{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;background:rgba(139,92,246,.18);border:2px solid rgba(167,139,250,.3);color:var(--primary-lighter)}
.leaderboard-item.rank-1{background:linear-gradient(120deg,rgba(251,191,36,.16),rgba(20,8,31,.6));border-color:rgba(251,191,36,.45);box-shadow:0 0 30px -10px rgba(251,191,36,.55)}
.leaderboard-item.rank-1 .leaderboard-rank{background:linear-gradient(135deg,#fde68a,#f59e0b);border-color:#fef3c7;color:#78350f;box-shadow:0 0 22px rgba(251,191,36,.85);font-size:20px}
.leaderboard-item.rank-2{background:linear-gradient(120deg,rgba(229,231,235,.13),rgba(20,8,31,.6));border-color:rgba(229,231,235,.4)}
.leaderboard-item.rank-2 .leaderboard-rank{background:linear-gradient(135deg,#f3f4f6,#9ca3af);border-color:#f9fafb;color:#374151;box-shadow:0 0 16px rgba(229,231,235,.6)}
.leaderboard-item.rank-3{background:linear-gradient(120deg,rgba(217,119,6,.14),rgba(20,8,31,.6));border-color:rgba(217,119,6,.4)}
.leaderboard-item.rank-3 .leaderboard-rank{background:linear-gradient(135deg,#fbbf24,#b45309);border-color:#fcd34d;color:#fff;box-shadow:0 0 16px rgba(217,119,6,.65)}

/* ================= 工具函数 ================= */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toHex(c){if(!c)return '#c4b5fd';if(/^#[0-9a-f]{6}$/i.test(c))return c;const m=c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);if(m)return '#'+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join('');return '#c4b5fd'}
function formatFullTime(ts){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function formatTime(ts){const d=new Date(ts),now=new Date(),diff=now-d;if(diff<60000)return '刚刚';if(diff<3600000)return Math.floor(diff/60000)+' 分钟前';const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),thatDay=new Date(d.getFullYear(),d.getMonth(),d.getDate()),dayDiff=Math.round((today-thatDay)/86400000),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0'),ss=String(d.getSeconds()).padStart(2,'0');if(dayDiff===0)return `今天 ${hh}:${mm}:${ss}`;if(dayDiff===1)return `昨天 ${hh}:${mm}:${ss}`;return `${d.getMonth()+1}月${d.getDate()}日 ${hh}:${mm}:${ss}`}

function switchView(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const target=document.getElementById('view-'+name);if(target)target.classList.add('active');document.querySelectorAll('.nav-link').forEach(l=>{l.classList.toggle('active',l.dataset.view===name)});if(name==='bubbles'){requestAnimationFrame(()=>renderBubbles())}else if(name==='score'){renderStudents();renderRecords();renderLeaderboard()}else if(name==='teachers'){renderTeachers()}}

function computeLayout(people,W,H){const n=people.length;if(!n||W<10||H<10)return[];const cx=W/2,cy=H/2,GOLDEN=2.399963,baseR=Math.max(16,Math.min(48,Math.sqrt((W*H)/(n*Math.PI*5))));const nodes=people.map((p,i)=>{const relCount=Object.keys(p.relations||{}).length,r=baseR+Math.min(relCount,8)*1.6,ang=i*GOLDEN,rad=Math.sqrt((i+0.5)/n)*Math.min(W,H)*0.42;return{id:p.id,r,x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad}});for(let it=0;it<420;it++){for(let i=0;i<n;i++){for(let j=i+1;j<n;j++){const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01;const minD=a.r+b.r+8;if(d<minD){const push=(minD-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push}}}for(const nd of nodes){nd.x+=(cx-nd.x)*0.012;nd.y+=(cy-nd.y)*0.012}}for(const nd of nodes){nd.x=Math.max(nd.r+4,Math.min(W-nd.r-4,nd.x));nd.y=Math.max(nd.r+4,Math.min(H-nd.r-4,nd.y))}return nodes}
const stage=document.getElementById('stage');
function renderBubbles(){if(!stage)return;stage.innerHTML='';const W=stage.clientWidth,H=stage.clientHeight;if(W<10||H<10)return;const nodes=computeLayout(state.people,W,H);nodes.forEach((node,i)=>{const p=state.people.find(x=>x.id===node.id);if(!p)return;const el=document.createElement('div');el.className='bubble';el.style.width=(node.r*2)+'px';el.style.height=(node.r*2)+'px';el.style.left=(node.x-node.r)+'px';el.style.top=(node.y-node.r)+'px';el.style.setProperty('--c',p.color);el.style.animationDelay=Math.min(i*18,800)+'ms';const emojiSize=Math.max(13,node.r*0.60),nameSize=Math.max(9,node.r*0.27);el.innerHTML=`<span class="bub-emoji" style="font-size:${emojiSize}px">${escapeHtml(p.emoji||'🙂')}</span><span class="bub-name" style="font-size:${nameSize}px">${escapeHtml(p.name)}</span>`;el.addEventListener('click',()=>openProfile(p.id));stage.appendChild(el)})}

function renderProfile(p){const av=document.getElementById('pAvatar');av.textContent=p.emoji||'🙂';av.style.background=`radial-gradient(circle at 32% 26%, rgba(255,255,255,.8), rgba(255,255,255,0) 60%), ${p.color}`;document.getElementById('pName').textContent=p.name;const tagsEl=document.getElementById('pTags');tagsEl.innerHTML=(p.tags||[]).filter(Boolean).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');document.getElementById('pIntro').textContent=(p.intro&&p.intro.trim())?p.intro:'这个人很懒，什么都没写 ~';const relCount=Object.keys(p.relations||{}).length,score=scoreState.scores[p.id]||0;document.getElementById('pMeta').textContent=`当前得分 ${score} 分 · 班级关系 ${relCount} 人 · 编号 ${state.people.indexOf(p)+1} / ${state.people.length}`;renderGraph(p)}
function renderGraph(p){const svg=document.getElementById('relGraph'),W=500,H=480,cx=W/2,cy=232;const entries=Object.entries(p.relations||{}).map(([id,r])=>({id,label:r.label||'同学',strength:Math.max(1,Math.min(5,r.strength||3)),person:state.people.find(x=>x.id===id)})).filter(e=>e.person).slice(0,8);const defs=`<defs><filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/></filter></defs>`;if(!entries.length){svg.innerHTML=defs+`<circle cx="${cx}" cy="${cy}" r="48" fill="${p.color}" opacity=".95" filter="url(#softShadow)"/><text x="${cx}" y="${cy-4}" text-anchor="middle" dominant-baseline="middle" font-size="30">${escapeHtml(p.emoji||'🙂')}</text><text x="${cx}" y="${cy+28}" text-anchor="middle" font-size="14" font-weight="800" fill="#2e1065">${escapeHtml(p.name)}</text><text x="${cx}" y="${cy+110}" text-anchor="middle" font-size="13" fill="#8b7bb8">还没有添加关系 ~</text>`;return}const R=158,n=entries.length;entries.forEach((e,i)=>{const ang=-Math.PI/2+(i*2*Math.PI/n);e._x=cx+Math.cos(ang)*R;e._y=cy+Math.sin(ang)*R});let edges='';entries.forEach(e=>{const w=1+e.strength*1.7,op=0.22+e.strength*0.14;edges+=`<line x1="${cx}" y1="${cy}" x2="${e._x}" y2="${e._y}" stroke="${p.color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`});let nodesHtml=`<g><circle cx="${cx}" cy="${cy}" r="50" fill="${p.color}" filter="url(#softShadow)"/><circle cx="${cx}" cy="${cy}" r="50" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/><text x="${cx}" y="${cy-6}" text-anchor="middle" dominant-baseline="middle" font-size="30">${escapeHtml(p.emoji||'🙂')}</text><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="14" font-weight="800" fill="#2e1065">${escapeHtml(p.name)}</text></g>`;entries.forEach(e=>{nodesHtml+=`<g><circle cx="${e._x}" cy="${e._y}" r="30" fill="${e.person.color}" filter="url(#softShadow)"/><text x="${e._x}" y="${e._y-3}" text-anchor="middle" dominant-baseline="middle" font-size="21">${escapeHtml(e.person.emoji||'🙂')}</text><text x="${e._x}" y="${e._y+44}" text-anchor="middle" font-size="12" font-weight="800" fill="#e9d5ff">${escapeHtml(e.person.name)}</text><text x="${e._x}" y="${e._y+59}" text-anchor="middle" font-size="10" fill="#8b7bb8">${escapeHtml(e.label)}</text></g>`});svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=defs+edges+nodesHtml}

function renderRelRows(p){const list=document.getElementById('relList');list.innerHTML='';Object.entries(p.relations||{}).forEach(([id,r])=>addRelRow(id,r.label,r.strength))}
function addRelRow(targetId='',label='',strength=3){const list=document.getElementById('relList'),options=state.people.filter(x=>x.id!==editingId).map(x=>`<option value="${x.id}" ${x.id===targetId?'selected':''}>${escapeHtml(x.emoji||'🙂')} ${escapeHtml(x.name)}</option>`).join(''),row=document.createElement('div');row.className='rel-row';row.innerHTML=`<select class="rel-person">${options}</select><input type="text" class="rel-label" value="${escapeHtml(label)}" placeholder="关系，如 同桌"><input type="range" class="rel-strength" min="1" max="5" value="${strength}"><button class="rel-del">✕</button>`;row.querySelector('.rel-del').addEventListener('click',()=>row.remove());list.appendChild(row)}
function saveEdit(){const p=state.people.find(x=>x.id===editingId);if(!p)return;Object.keys(p.relations||{}).forEach(oid=>{const other=state.people.find(x=>x.id===oid);if(other&&other.relations)delete other.relations[p.id]});p.name=document.getElementById('fName').value.trim()||p.name;p.emoji=document.getElementById('fEmoji').value.trim()||'🙂';p.color=document.getElementById('fColor').value;p.intro=document.getElementById('fIntro').value.trim();p.tags=document.getElementById('fTags').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);const newRel={};document.querySelectorAll('#relList .rel-row').forEach(row=>{const tid=row.querySelector('.rel-person').value;if(!tid)return;const label=row.querySelector('.rel-label').value.trim()||'同学',strength=Number(row.querySelector('.rel-strength').value)||3;newRel[tid]={label,strength};const other=state.people.find(x=>x.id===tid);if(other){other.relations=other.relations||{};other.relations[p.id]={label,strength}}});p.relations=newRel;saveData();renderBubbles();renderProfile(p);if(document.getElementById('view-score').classList.contains('active')){renderStudents();renderLeaderboard()}closeModal()}

function addScore(studentId,delta,reason){const student=state.people.find(s=>s.id===studentId);if(!student||!delta)return;scoreState.scores[studentId]=(scoreState.scores[studentId]||0)+delta;const finalReason=(reason&&reason.trim())||(delta>0?'表现优秀':'违反纪律');scoreState.records.unshift({id:'r'+Date.now()+'_'+Math.random().toString(36).slice(2,6),studentId:student.id,studentName:student.name,delta,reason:finalReason,time:Date.now()});if(scoreState.records.length>300)scoreState.records=scoreState.records.slice(0,300);saveScore();renderStudents();renderRecords();renderLeaderboard()}
function undoRecord(recordId){const idx=scoreState.records.findIndex(r=>r.id===recordId);if(idx<0)return;const rec=scoreState.records[idx];scoreState.scores[rec.studentId]=(scoreState.scores[rec.studentId]||0)-rec.delta;scoreState.records.splice(idx,1);saveScore();renderStudents();renderRecords();renderLeaderboard()}
function renderStudents(){const grid=document.getElementById('studentsGrid');if(!grid)return;grid.innerHTML='';const kw=searchKeyword.trim().toLowerCase(),list=kw?state.people.filter(p=>p.name.toLowerCase().includes(kw)||(p.tags||[]).some(t=>t.toLowerCase().includes(kw))):state.people;if(!list.length){grid.innerHTML=`<div class="empty-records" style="grid-column:1/-1"><span class="ico">🔍</span>没有找到匹配的同学</div>`;return}list.forEach(p=>{const score=scoreState.scores[p.id]||0,card=document.createElement('div');card.className='student-card';card.style.setProperty('--c',p.color);const tagsText=(p.tags||[]).slice(0,3).join(' · ');card.innerHTML=`<div class="student-top"><div class="student-avatar">${escapeHtml(p.emoji||'🙂')}</div><div class="student-info"><span class="student-name" contenteditable="true" spellcheck="false">${escapeHtml(p.name)}</span><div class="student-tags">${escapeHtml(tagsText||'—')}</div></div></div><div class="student-score-row"><span class="student-score-label">SCORE</span><span class="student-score">${score}</span></div><div class="student-add"><button class="score-add-btn" data-add="1">+1</button><button class="score-add-btn" data-add="2">+2</button><button class="score-add-btn" data-add="5">+5</button><button class="score-add-btn minus" data-add="-1">−1</button><button class="score-add-btn" data-add="custom">＋?</button></div>`;const nameEl=card.querySelector('.student-name');nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nameEl.blur()}});nameEl.addEventListener('blur',()=>{const newName=nameEl.innerText.trim()||p.name;if(newName!==p.name){p.name=newName;saveData();renderLeaderboard()}nameEl.innerText=newName});nameEl.addEventListener('paste',e=>{e.preventDefault();const text=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,text)});card.querySelectorAll('.score-add-btn').forEach(btn=>{btn.addEventListener('click',()=>{const val=btn.dataset.add;if(val==='custom'){const input=prompt(`给「${p.name}」加减分（正数加分 / 负数扣分）：`,'3');if(input===null)return;const n=Number(input);if(!Number.isFinite(n)||n===0)return;const reason=prompt('原因（可选）：','');if(reason===null)return;addScore(p.id,n,reason)}else{addScore(p.id,Number(val),'')}})});grid.appendChild(card)})}
function renderRecords(){const list=document.getElementById('recordsList'),countEl=document.getElementById('recordsCount');if(!list)return;if(countEl)countEl.textContent=scoreState.records.length?`共 ${scoreState.records.length} 条`:'';if(!scoreState.records.length){list.innerHTML=`<div class="empty-records"><span class="ico">📋</span>还没有加分记录，点同学卡片上的 +1 试试吧~</div>`;return}list.innerHTML='';scoreState.records.forEach((r,i)=>{const item=document.createElement('div');item.className='record-item';item.style.animationDelay=Math.min(i*15,400)+'ms';const isPlus=r.delta>0,deltaText=(isPlus?'+':'')+r.delta,student=state.people.find(s=>s.id===r.studentId),avatar=student?(student.emoji||'🙂'):'🙂',color=student?student.color:'#a78bfa';item.innerHTML=`<span class="record-delta ${isPlus?'plus':'minus'}">${deltaText}</span><span class="record-avatar" style="background:${color}">${escapeHtml(avatar)}</span><span class="record-student">${escapeHtml(r.studentName||'未知同学')}</span><span class="record-reason">${escapeHtml(r.reason||'')}</span><span class="record-time" title="${formatFullTime(r.time)}">${formatTime(r.time)}</span><button class="record-undo">撤销</button>`;item.querySelector('.record-undo').addEventListener('click',()=>undoRecord(r.id));list.appendChild(item)})}
function renderLeaderboard(){const listEl=document.getElementById('leaderboardList');if(!listEl)return;const ranked=state.people.map(p=>({...p,score:scoreState.scores[p.id]||0})).filter(p=>p.score>0).sort((a,b)=>{if(b.score!==a.score)return b.score-a.score;return a.name.localeCompare(b.name,'zh')}).slice(0,5);if(!ranked.length){listEl.innerHTML=`<div class="empty-records" style="padding:24px 0"><span class="ico">🏆</span>还没有人获得加分，快去表扬同学吧~</div>`;return}const medals=['🥇','🥈','🥉','',''];listEl.innerHTML='';ranked.forEach((p,i)=>{const item=document.createElement('div');item.className='leaderboard-item rank-'+(i+1);item.style.animationDelay=(i*50)+'ms';const medal=medals[i]||`#${i+1}`;item.innerHTML=`<div class="leaderboard-rank">${i+1}</div><div class="leaderboard-avatar" style="background:${p.color}">${escapeHtml(p.emoji||'🙂')}</div><div class="leaderboard-name">${escapeHtml(p.name)}</div><div class="leaderboard-score">+${p.score}</div><div class="leaderboard-medal">${medal}</div>`;listEl.appendChild(item)})}

function renderTeachers(){const grid=document.getElementById('teachersGrid');if(!grid)return;grid.innerHTML='';teachers.forEach(t=>{const card=document.createElement('div');card.className='teacher-card';card.style.setProperty('--c',t.color);card.innerHTML=`<div class="teacher-avatar-circle">${escapeHtml(t.emoji||'🧑‍🏫')}</div><div class="teacher-name">${escapeHtml(t.name)}</div><div class="teacher-subject">${escapeHtml(t.subject||'老师')}</div><div class="teacher-counts"><span>🌸 ${t.flowers||0}</span><span>❤️ ${t.hearts||0}</span></div>`;card.addEventListener('click',()=>openTeacher(t.id));grid.appendChild(card)})}
function openTeacher(id){const t=teachers.find(x=>x.id===id);if(!t)return;editingTeacherId=id;const av=document.getElementById('tmAvatar');av.textContent=t.emoji||'🧑‍🏫';av.style.background=t.color;document.getElementById('tmName').value=t.name||'';document.getElementById('tmSubject').value=t.subject||'';document.getElementById('tmIntro').value=t.intro||'';document.getElementById('tmFlowers').textContent=t.flowers||0;document.getElementById('tmHearts').textContent=t.hearts||0;document.getElementById('teacherModal').classList.add('open')}
function closeTeacherModal(){document.getElementById('teacherModal').classList.remove('open');editingTeacherId=null}
function saveTeacher(){const t=teachers.find(x=>x.id===editingTeacherId);if(!t)return;t.name=document.getElementById('tmName').value.trim()||t.name;t.subject=document.getElementById('tmSubject').value.trim();t.intro=document.getElementById('tmIntro').value.trim();saveTeachers();renderTeachers();closeTeacherModal()}
function sendGift(teacherId,type){const t=teachers.find(x=>x.id===teacherId);if(!t)return;if(type==='flower'){t.flowers=(t.flowers||0)+1}else{t.hearts=(t.hearts||0)+1}saveTeachers();document.getElementById('tmFlowers').textContent=t.flowers||0;document.getElementById('tmHearts').textContent=t.hearts||0;renderTeachers();playGiftAnimation(type)}
function playGiftAnimation(type){const layer=document.getElementById('giftLayer'),emojis=type==='flower'?['🌸','💐','🌷','🌺','🏵️','🌼']:['❤️','💖','💗','💓','💕','💝'];for(let i=0;i<18;i++){const el=document.createElement('div');el.className='gift-particle';el.textContent=emojis[Math.floor(Math.random()*emojis.length)];el.style.left=(Math.random()*100)+'vw';el.style.fontSize=(20+Math.random()*22)+'px';el.style.setProperty('--drift',((Math.random()-0.5)*220).toFixed(1)+'px');el.style.animationDelay=(Math.random()*0.5)+'s';el.style.animationDuration=(1.6+Math.random()*0.9)+'s';layer.appendChild(el);setTimeout(()=>el.remove(),3200)}}

/* ================= 事件绑定 ================= */
document.querySelectorAll('.nav-link').forEach(btn=>{btn.addEventListener('click',()=>switchView(btn.dataset.view))});
document.getElementById('navBrand').addEventListener('click',()=>switchView('home'));
document.getElementById('closeProfile').addEventListener('click',closeProfile);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeProfile()});
document.getElementById('editBtn').addEventListener('click',openEdit);
document.getElementById('addRelBtn').addEventListener('click',()=>addRelRow());
document.getElementById('cancelBtn').addEventListener('click',closeModal);
document.getElementById('saveBtn').addEventListener('click',saveEdit);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.getElementById('studentSearch').addEventListener('input',e=>{searchKeyword=e.target.value;renderStudents()});
document.getElementById('clearRecordsBtn').addEventListener('click',()=>{if(!scoreState.records.length){alert('还没有记录可以清空~');return}if(!confirm('确定要清空所有加分记录吗？（同学分数和排行榜不会重置）'))return;scoreState.records=[];saveScore();renderRecords()});
document.getElementById('closeTeacherModal').addEventListener('click',closeTeacherModal);
document.getElementById('cancelTeacherBtn').addEventListener('click',closeTeacherModal);
document.getElementById('saveTeacherBtn').addEventListener('click',saveTeacher);
document.getElementById('teacherModal').addEventListener('click',e=>{if(e.target===document.getElementById('teacherModal'))closeTeacherModal()});
document.getElementById('sendFlowerBtn').addEventListener('click',()=>{if(editingTeacherId)sendGift(editingTeacherId,'flower')});
document.getElementById('sendHeartBtn').addEventListener('click',()=>{if(editingTeacherId)sendGift(editingTeacherId,'heart')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal.classList.contains('open'))closeModal();else if(document.getElementById('teacherModal').classList.contains('open'))closeTeacherModal();else if(overlay.classList.contains('open'))closeProfile()}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(document.getElementById('view-bubbles').classList.contains('active'))renderBubbles()},180)});

/* ================= 启动与实时同步 ================= */
(async function init(){
  // 首页文字
  const homeData=await loadHomeData(),hd={...HOME_DEFAULT,...homeData};
  document.querySelectorAll('#view-home [data-key]').forEach(el=>{const key=el.dataset.key;if(hd[key]!==undefined)el.innerText=hd[key]});
  const navTitle=document.getElementById('navTitleText');if(navTitle)navTitle.textContent=hd.className||'六年二班';document.title=(hd.className||'六年二班')+' · 班级主页';
  initHomeEditing();

  // 同学录
  const saved=await loadData();
  if(saved){state.people=saved}else{state.people=buildPeople();saveData()}

  // 加分和老师
  await loadScoreData();
  teachers=await loadTeachers();

  // 实时同步（关键！打开这个，多端就能自动刷新了）
  supabase.channel('class-sync').on('postgres_changes',{event:'*',schema:'public',table:'class_data'},async(payload)=>{
    const key=payload.new.key;
    if(key==='people'){const d=await cloudLoad('people');if(d){state.people=d;renderBubbles();if(document.getElementById('view-score').classList.contains('active'))renderStudents()}}
    else if(key==='score'){await loadScoreData();if(document.getElementById('view-score').classList.contains('active')){renderStudents();renderRecords();renderLeaderboard()}}
    else if(key==='teachers'){teachers=await loadTeachers();if(document.getElementById('view-teachers').classList.contains('active'))renderTeachers()}
    else if(key==='home'){const hd2=await cloudLoad('home');if(hd2){document.querySelectorAll('#view-home [data-key]').forEach(el=>{if(hd2[el.dataset.key]!==undefined)el.innerText=hd2[el.dataset.key]});const nt=document.getElementById('navTitleText');if(nt)nt.textContent=hd2.className||'六年二班'}}
  }).subscribe();
})();
</script>
</body>
